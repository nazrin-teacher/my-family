<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Errol the Eagle · Lesson 10</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one fixed 16:9 classroom "board" (1600×900) scaled to fit any screen; a slim tool bar on top and one big play area below. Single bright pastel look on purpose (classroom world). */
:root{
  --frame:#9FCBEF;
  --sky:#E9F5FF;
  --paper:#FFFDF8;
  --ink:#2F2A55;
  --ink-soft:#67648C;
  --line:#D5E3F4;
  --pink:#FF7EB6; --pink-d:#D9468A; --pink-l:#FFE0EE;
  --blue:#4A90FF; --blue-d:#2A62C8; --blue-l:#DDEBFF;
  --yellow:#FFD43B; --yellow-d:#C99500; --yellow-l:#FFF3C4;
  --green:#3FCB6E; --green-d:#229A4C; --green-l:#D6F5E1;
  --errol:#E9892F;
  --display:'Fredoka','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--frame);color:var(--ink)}
body{font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:5px solid var(--blue-d);outline-offset:4px}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--sky);overflow:hidden;font-family:var(--display);border-radius:18px;box-shadow:0 10px 40px rgba(30,40,90,.25)}
#stage.fs{border-radius:0}

/* ---------- top bar ---------- */
#bar{position:absolute;left:0;top:0;right:0;height:96px;display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--paper);border-bottom:4px solid var(--line);z-index:30}
.tb{width:72px;height:72px;border-radius:22px;background:var(--sky);display:grid;place-items:center;border:3px solid var(--line);transition:transform .12s}
.tb:active{transform:scale(.92)}
.tb svg{width:38px;height:38px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tb.off{background:#F1F0F6}
.tb.off svg{stroke:var(--ink-soft)}
#title{flex:1;min-width:0;display:flex;align-items:center;gap:16px;justify-content:center}
#title img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:4px solid var(--errol);background:#fff}
#tName{font-size:40px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tMeta{font-family:var(--body);font-size:17px;font-weight:700;color:var(--ink-soft);background:var(--sky);padding:6px 12px;border-radius:12px;white-space:nowrap}
#stars{display:flex;align-items:center;gap:8px;font-size:36px;font-weight:600;background:var(--yellow-l);border:3px solid var(--yellow);border-radius:22px;height:72px;padding:0 18px;font-variant-numeric:tabular-nums}
#stars svg{width:38px;height:38px;fill:var(--yellow);stroke:var(--yellow-d);stroke-width:1.6}
#stars.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}

/* ---------- play area ---------- */
#area{position:absolute;left:0;right:0;top:96px;bottom:0;overflow:hidden}
.rg{position:absolute;inset:0;display:grid;grid-template-rows:118px 1fr 104px;padding:16px 40px 8px}
.rg-prompt{display:flex;align-items:center;justify-content:center}
.rg-body{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.rg-foot{display:flex;align-items:center;justify-content:space-between;gap:20px}
.prompt{display:flex;align-items:center;gap:22px;background:var(--paper);border:4px solid var(--line);border-radius:60px;padding:10px 40px 10px 12px;max-width:100%}
.ptext{font-size:58px;font-weight:600;line-height:1.1;text-wrap:balance}
.spk{width:84px;height:84px;flex:none;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:0 6px 0 var(--blue-d)}
.spk:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-d)}
.spk svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:12px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--line)}
.dot.on{background:var(--errol);border-color:var(--errol);transform:scale(1.15)}
.dot.past{background:var(--green-l);border-color:var(--green)}
.nextbtn{height:84px;padding:0 34px 0 40px;border-radius:44px;background:var(--errol);color:#fff;font-size:40px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 7px 0 #B5621A}
.nextbtn svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.nextbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #B5621A}
.nextbtn.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.bigbtn{height:100px;padding:0 48px;border-radius:52px;font-size:46px;font-weight:600;color:#fff;background:var(--green);box-shadow:0 8px 0 var(--green-d);display:inline-flex;align-items:center;gap:14px}
.bigbtn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--green-d)}
.bigbtn.blue{background:var(--blue);box-shadow:0 8px 0 var(--blue-d)}
.bigbtn.orange{background:var(--errol);box-shadow:0 8px 0 #B5621A}
.bigbtn.pink{background:var(--pink);box-shadow:0 8px 0 var(--pink-d)}
.bigbtn svg{width:46px;height:46px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bigbtn.ghost{background:#fff;color:var(--ink);box-shadow:0 8px 0 var(--line);border:4px solid var(--line)}
.bigbtn.ghost svg{stroke:var(--ink)}

/* objects */
.obj{width:100%;height:100%;display:block;overflow:visible}
.objrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:34px;max-width:1500px}
.ob{--s:250px;width:var(--s);height:var(--s);padding:18px;border-radius:40px;background:var(--paper);border:6px solid var(--line);position:relative;transition:transform .15s,border-color .2s,box-shadow .2s;touch-action:manipulation}
.ob:active{transform:scale(.95)}
.ob.right{border-color:var(--green);box-shadow:0 0 0 12px rgba(63,203,110,.35);transform:scale(1.08);z-index:2}
.ob.dim{opacity:.35}
.locked{pointer-events:none}
.badge{position:absolute;right:-16px;top:-16px;width:70px;height:70px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 4px 0 var(--green-d);animation:pop .4s}
.badge svg{width:42px;height:42px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.badge.star{background:var(--yellow);box-shadow:0 4px 0 var(--yellow-d)}
.badge.star svg{fill:#fff;stroke:none}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px) rotate(-3deg)}40%{transform:translateX(12px) rotate(3deg)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.wiggle{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-3deg)}}

/* cheer + toast */
#cheer{position:absolute;left:50%;top:50%;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%)}
#cheer .cs{width:230px;height:230px;fill:var(--yellow);stroke:#fff;stroke-width:1.2;filter:drop-shadow(0 8px 0 var(--yellow-d))}
#cheer .cw{font-size:84px;font-weight:700;color:#fff;-webkit-text-stroke:3px var(--errol);paint-order:stroke fill;text-shadow:0 6px 0 var(--errol);margin-top:-10px;white-space:nowrap}
#cheer.go{animation:cheer 1.3s forwards}
@keyframes cheer{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.spark{position:absolute;width:34px;height:34px;z-index:59;pointer-events:none;fill:var(--yellow);animation:spark 1s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.4);opacity:0}}
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%);z-index:55;background:#fff;border:5px solid var(--pink);color:var(--pink-d);font-size:50px;font-weight:600;padding:12px 40px;border-radius:50px;box-shadow:0 8px 0 rgba(217,70,138,.25);pointer-events:none}
#toast.go{animation:toast 1.3s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}

/* modal (teacher help, confirm, say-it) */
.modal{position:absolute;inset:0;z-index:70;background:rgba(40,40,80,.45);display:grid;place-items:center}
.sheet{background:var(--paper);border-radius:36px;padding:40px 48px;max-width:1100px;width:calc(100% - 160px);box-shadow:0 20px 60px rgba(0,0,0,.25);font-family:var(--body);position:relative}
.sheet h2{font-family:var(--display);font-size:40px;margin:0 0 14px;font-weight:600}
.sheet p,.sheet li{font-size:24px;line-height:1.5;margin:0 0 10px;color:var(--ink)}
.sheet ul{margin:0 0 10px;padding-left:28px}
.sheet .row{display:flex;gap:18px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.tbtn{font-family:var(--body);font-size:24px;font-weight:800;padding:16px 30px;border-radius:18px;background:var(--sky);border:3px solid var(--line)}
.tbtn.warn{background:#FFE4E4;border-color:#F4A6A6;color:#A3262A}
.tbtn.ok{background:var(--blue);border-color:var(--blue);color:#fff}
.xbtn{position:absolute;right:20px;top:20px;width:64px;height:64px;border-radius:50%;background:var(--sky);display:grid;place-items:center}
.xbtn svg{width:32px;height:32px;stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}

/* ---------- home ---------- */
.home{position:absolute;inset:0;padding:22px 40px;display:flex;flex-direction:column;gap:16px}
.home-top{display:flex;align-items:center;gap:16px}
.home-top h1{margin:0;font-size:44px;font-weight:700;line-height:1;white-space:nowrap}
.home-top h1 small{display:block;font-family:var(--body);font-size:20px;font-weight:700;color:var(--ink-soft);margin-top:8px;letter-spacing:.02em}
.home-top .sp{flex:1}
.seg{display:flex;flex:none;background:#fff;border:3px solid var(--line);border-radius:18px;overflow:hidden;font-family:var(--body);font-weight:800;font-size:18px;white-space:nowrap}
.seg span{padding:0 14px;display:grid;place-items:center;color:var(--ink-soft)}
.seg button{padding:12px 14px;font-weight:800}
.seg button.on{background:var(--blue);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:18px;flex:1;min-height:0}
.tile{background:var(--paper);border:4px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;text-align:left;position:relative;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile .th{flex:1;min-height:0;background:var(--sky);display:grid;place-items:center;overflow:hidden}
.tile .th img{width:100%;height:100%;object-fit:cover}
.tile .th svg.obj{width:auto;height:84%}
.tile .tt{padding:8px 14px 10px;display:flex;align-items:baseline;gap:10px}
.tile .n{font-size:22px;font-weight:700;color:#fff;background:var(--errol);border-radius:10px;min-width:34px;text-align:center;padding:0 6px}
.tile .en{font-size:22px;font-weight:600;line-height:1.05;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tr{font-family:var(--body);font-size:15px;font-weight:700;color:var(--ink-soft);padding:0 14px 10px;margin-top:-6px}
.tile .done{position:absolute;right:10px;top:10px;width:48px;height:48px}
.tile.isdone{border-color:var(--green)}

/* ---------- hello / bye ---------- */
.split{position:absolute;inset:0;display:grid;grid-template-columns:1fr 560px;gap:40px;padding:40px 50px;align-items:center}
.pic{border-radius:40px;overflow:hidden;border:8px solid #fff;box-shadow:0 12px 0 var(--line);background:#fff;cursor:pointer}
.pic img{display:block;width:100%}
.say-col{display:flex;flex-direction:column;gap:26px;align-items:stretch}
.bubble{position:relative;background:#fff;border:5px solid var(--ink);border-radius:44px;padding:26px 34px;font-size:64px;font-weight:600;line-height:1.1;text-align:center}
.bubble:after{content:"";position:absolute;left:-36px;top:46%;border:20px solid transparent;border-right:30px solid var(--ink)}
.line-btn{font-size:66px;font-weight:700;padding:16px 26px;border-radius:34px;background:#fff;border:5px solid var(--line);display:flex;align-items:center;gap:20px;text-align:left}
.line-btn:active{transform:scale(.97)}
.line-btn .spk{width:76px;height:76px}

/* ---------- words ---------- */
.wordcard{display:flex;flex-direction:column;align-items:center;gap:18px}
.wordpic{height:470px;width:760px;display:grid;place-items:center;background:#fff;border-radius:44px;border:6px solid var(--line);padding:26px;cursor:pointer}
.wordpic img,.wordpic svg{max-height:100%;max-width:100%;object-fit:contain}
.wordpic svg{height:100%}
.word{font-size:84px;font-weight:700;line-height:1}
.word .c{padding:0 .1em;border-radius:.2em}

/* ---------- say it modal ---------- */
.sayit{display:flex;align-items:center;gap:50px}
.sayit .big{width:440px;height:440px;background:#fff;border-radius:50px;border:6px solid var(--line);padding:30px}
.sayit .sent{font-size:96px;font-weight:700;line-height:1}
.sayit .sub{font-size:56px;font-weight:600;margin-top:22px;display:flex;align-items:center;gap:18px}
.chip{display:inline-block;width:64px;height:64px;border-radius:50%;border:5px solid var(--ink)}
.tick{position:absolute;right:-12px;top:-12px;width:58px;height:58px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.tick svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- magic bag ---------- */
.magic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:80px}
.bagwrap{position:relative;width:520px;height:600px;display:flex;align-items:flex-end;justify-content:center}
.bagbtn{width:440px;height:440px;border-radius:50px;transition:transform .2s}
.bagbtn img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.bagbtn.shakebag{animation:bagshake .7s}
@keyframes bagshake{15%{transform:rotate(-8deg)}30%{transform:rotate(7deg)}45%{transform:rotate(-6deg)}60%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}}
.popout{position:absolute;left:50%;top:0;width:300px;height:300px;margin-left:-150px;background:#fff;border-radius:50%;border:8px solid var(--yellow);padding:34px;animation:popout .7s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 0 0 18px rgba(255,212,59,.3)}
@keyframes popout{0%{transform:translateY(300px) scale(.2);opacity:0}100%{transform:none;opacity:1}}
.magic-side{display:flex;flex-direction:column;gap:26px;align-items:center;width:560px}
.magic-side .cap{font-size:76px;font-weight:700;min-height:90px;text-align:center}

/* ---------- missing ---------- */
.mcards{display:flex;gap:30px;justify-content:center}
.mcard{width:240px;height:240px;perspective:900px;position:relative}
.mcard .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.mcard.cov .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:36px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.mcard .f{background:#fff;border:6px solid var(--line);padding:22px}
.mcard .b{transform:rotateY(180deg);background:var(--errol);border:6px solid #C46B1F}
.mcard .b img{width:70%;border-radius:50%;border:5px solid #fff}
.mcard .q{position:absolute;inset:0;border-radius:36px;background:var(--pink);display:grid;place-items:center;font-size:150px;color:#fff;font-weight:700;border:6px solid var(--pink-d)}
.mopts{display:flex;gap:40px;justify-content:center;margin-top:34px}
.mopts .ob{--s:190px}

/* ---------- sorting ---------- */
.sort{position:absolute;inset:0;display:grid;grid-template-rows:118px 210px 1fr 96px;padding:16px 40px 8px}
.shelf{display:flex;gap:14px;justify-content:center;align-items:center;background:rgba(255,255,255,.6);border-radius:34px;border:4px dashed var(--line);padding:0 16px}
.it{width:136px;height:136px;padding:10px;border-radius:30px;background:#fff;border:5px solid var(--line);touch-action:none;cursor:grab;transition:transform .15s,box-shadow .15s}
.it.sel{border-color:var(--errol);box-shadow:0 0 0 10px rgba(233,137,47,.35);transform:translateY(-10px) scale(1.06)}
.it.gone{visibility:hidden}
.dragghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;background:#fff;border-radius:30px;border:5px solid var(--errol);box-shadow:0 18px 30px rgba(0,0,0,.25);padding:10px}
.dragghost.back{transition:transform .35s ease-in}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;align-items:end;padding-top:20px}
.bin{position:relative;height:100%;max-height:390px;border-radius:30px 30px 46px 46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:14px;border:6px solid;transition:transform .15s}
.bin.hot{transform:scale(1.05)}
.bin .tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-end;flex:1;width:100%}
.bin .tray svg{width:78px;height:78px;animation:pop .35s}
.bin .lab{font-size:40px;font-weight:700;color:#fff;letter-spacing:.04em;text-shadow:0 3px 0 rgba(0,0,0,.18);padding-top:6px}
.bin .rim{position:absolute;left:-6px;right:-6px;top:-6px;height:34px;border-radius:30px 30px 10px 10px;opacity:.35;background:#fff}

/* ---------- colour it ---------- */
.pots{display:flex;gap:46px;justify-content:center;margin-top:20px}
.pot{width:140px;height:140px;transition:transform .15s}
.pot:active{transform:scale(.92)}
.paintobj{width:330px;height:330px;background:#fff;border-radius:50px;border:6px solid var(--line);padding:30px}

/* ---------- match ---------- */
.mrow{display:flex;gap:30px;justify-content:center}
.mrow .ob{--s:200px}
.ob.sel{border-color:var(--errol);box-shadow:0 0 0 12px rgba(233,137,47,.35)}
.ob.matched{border-color:var(--green);background:var(--green-l);pointer-events:none}

/* ---------- wheel ---------- */
.wheel-act{position:absolute;inset:0}
.wheelbox{position:absolute;left:110px;top:72px;width:640px;height:640px}
.wheel-rot{position:absolute;inset:0;transition:transform 5.2s cubic-bezier(.12,.82,.16,1)}
.wheel-rot svg{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 0 rgba(47,42,85,.18))}
.pointer{position:absolute;left:50%;top:-44px;width:92px;height:104px;margin-left:-46px;z-index:3;pointer-events:none}
.hub{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:var(--paper);border:8px solid var(--ink);z-index:4;font-size:52px;font-weight:700;color:var(--ink);box-shadow:0 8px 0 rgba(47,42,85,.3)}
.hub:active{transform:scale(.95)}
.hub:disabled{opacity:.85}
.legend{position:absolute;left:860px;right:60px;top:60px;display:flex;flex-direction:column;gap:18px}
.leg{display:flex;align-items:center;gap:24px;padding:10px 26px;border-radius:36px;background:#fff;border:6px solid var(--line);text-align:left;transition:transform .2s}
.leg .ic{width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center}
.leg .ic svg{width:80px;height:80px}
.leg .lt{font-size:46px;font-weight:600;white-space:nowrap}
.leg.hit{transform:scale(1.06)}
.leg .cnt{margin-left:auto;display:flex;gap:8px}
.leg .cnt i{width:22px;height:22px;border-radius:50%;border:4px solid var(--line);background:#fff}
.leg .cnt i.on{background:var(--green);border-color:var(--green)}
.wheel-hint{position:absolute;left:860px;right:60px;bottom:26px;font-size:44px;font-weight:600;color:var(--ink-soft);text-align:center}
.envview,.taskview{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:26px 40px}
.envhead{display:flex;align-items:center;gap:24px;font-size:64px;font-weight:700;color:#fff;padding:12px 50px 12px 14px;border-radius:70px}
.envhead .ic{width:100px;height:100px;border-radius:50%;background:#fff;display:grid;place-items:center}
.envhead .ic svg{width:74px;height:74px}
.envs{flex:1;display:flex;align-items:center;justify-content:center;gap:70px}
.env{width:340px;height:250px;position:relative;perspective:900px;transition:transform .2s}
.env:active{transform:scale(.96)}
.env>div{position:absolute;inset:0;border-radius:22px}
.env .eb{background:var(--d);border:6px solid var(--ink)}
.env .ep{left:9%;right:9%;top:10%;bottom:12%;background:#fff;border-radius:16px;border:5px solid var(--ink);transition:transform .6s .2s;display:grid;place-items:center}
.env .ep svg{width:60%;height:60%}

.lvrow{display:flex;align-items:center;gap:70px}
.ringwrap.sm{width:230px;height:230px}

.errol *{transform-box:view-box}
.errol .fig{transform-origin:200px 500px}
.errol .upper{transform-origin:200px 400px}
.errol .head{transform-origin:200px 250px}
.errol .wl{transform-origin:122px 268px}
.errol .wr{transform-origin:278px 268px}
.errol .legL{transform-origin:170px 392px}
.errol .legR{transform-origin:230px 392px}
.errol .hold{display:none}
.errol.p-show .hold{display:inline}
.errol g{animation-duration:var(--b,.5s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-direction:alternate}

/* dance */
.m-dance .upper{animation-name:swayU}.m-dance .head{animation-name:headB}.m-dance .fig{animation-name:bobF}
.m-dance .wl{animation-name:wlD}.m-dance .wr{animation-name:wrD}.m-dance .legL{animation-name:legBL}.m-dance .legR{animation-name:legBR}
@keyframes swayU{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes headB{from{transform:rotate(7deg)}to{transform:rotate(-7deg)}}
@keyframes bobF{from{transform:translateY(0)}to{transform:translateY(-22px)}}
@keyframes wlD{from{transform:rotate(20deg)}to{transform:rotate(115deg)}}
@keyframes wrD{from{transform:rotate(-115deg)}to{transform:rotate(-20deg)}}
@keyframes legBL{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes legBR{from{transform:rotate(-8deg)}to{transform:rotate(6deg)}}
/* fly */
.m-fly .wl{animation-name:flapL;animation-duration:.32s}.m-fly .wr{animation-name:flapR;animation-duration:.32s}.m-fly .fig{animation-name:hover;animation-duration:1.2s}.m-fly .head{animation-name:headB;animation-duration:1.2s}
@keyframes flapL{from{transform:rotate(10deg)}to{transform:rotate(128deg)}}
@keyframes flapR{from{transform:rotate(-10deg)}to{transform:rotate(-128deg)}}
@keyframes hover{from{transform:translateY(0)}to{transform:translateY(-55px)}}
/* jump */
.m-jump .fig{animation-name:jumpF;animation-duration:.9s;animation-direction:normal}.m-jump .wl{animation-name:jWL;animation-duration:.9s;animation-direction:normal}.m-jump .wr{animation-name:jWR;animation-duration:.9s;animation-direction:normal}.m-jump .legL{animation-name:jLL;animation-duration:.9s;animation-direction:normal}.m-jump .legR{animation-name:jLR;animation-duration:.9s;animation-direction:normal}
@keyframes jumpF{0%{transform:translateY(0) scale(1.06,.9)}15%{transform:translateY(0) scale(1)}45%,60%{transform:translateY(-130px)}88%{transform:translateY(0) scale(1.06,.9)}100%{transform:translateY(0)}}
@keyframes jWL{0%,15%,90%,100%{transform:rotate(20deg)}45%,60%{transform:rotate(135deg)}}
@keyframes jWR{0%,15%,90%,100%{transform:rotate(-20deg)}45%,60%{transform:rotate(-135deg)}}
@keyframes jLL{0%,15%,90%,100%{transform:rotate(0)}45%,60%{transform:rotate(18deg)}}
@keyframes jLR{0%,15%,90%,100%{transform:rotate(0)}45%,60%{transform:rotate(-18deg)}}
/* spin */
.m-spin .fig{animation-name:spinF;animation-duration:1.5s;animation-timing-function:linear;animation-direction:normal}.m-spin .wl{transform:rotate(80deg)}.m-spin .wr{transform:rotate(-80deg)}
@keyframes spinF{0%{transform:scaleX(1)}25%{transform:scaleX(.06)}50%{transform:scaleX(-1)}75%{transform:scaleX(.06)}100%{transform:scaleX(1)}}
/* wiggle */
.m-wiggle .upper{animation-name:wigU;animation-duration:.24s}.m-wiggle .fig{animation-name:wigF;animation-duration:.24s}.m-wiggle .wl{transform:rotate(45deg)}.m-wiggle .wr{transform:rotate(-45deg)}
@keyframes wigU{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes wigF{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
/* hands up */
.m-handsup .wl{animation-name:huL}.m-handsup .wr{animation-name:huR}.m-handsup .upper{animation-name:swayU}.m-handsup .fig{animation-name:bobF}
@keyframes huL{from{transform:rotate(130deg)}to{transform:rotate(165deg)}}
@keyframes huR{from{transform:rotate(-165deg)}to{transform:rotate(-130deg)}}
/* clap */
.m-clap .wl{animation-name:clapL;animation-duration:.42s}.m-clap .wr{animation-name:clapR;animation-duration:.42s}.m-clap .head{animation-name:headB;animation-duration:.84s}
@keyframes clapL{from{transform:rotate(70deg)}to{transform:rotate(-58deg)}}
@keyframes clapR{from{transform:rotate(-70deg)}to{transform:rotate(58deg)}}
/* stamp */
.m-stamp .legL{animation-name:stL;animation-duration:.8s;animation-direction:normal}.m-stamp .legR{animation-name:stR;animation-duration:.8s;animation-direction:normal}.m-stamp .fig{animation-name:bobF;animation-duration:.4s}.m-stamp .wl{transform:rotate(35deg)}.m-stamp .wr{transform:rotate(-35deg)}
@keyframes stL{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-45px) rotate(8deg)}}
@keyframes stR{0%,50%,100%{transform:translateY(0)}75%{transform:translateY(-45px) rotate(-8deg)}}
/* touch your toes */
.m-toes .upper{animation-name:toesU;animation-duration:1.6s;animation-direction:normal}.m-toes .wl{animation-name:toesWL;animation-duration:1.6s;animation-direction:normal}.m-toes .wr{animation-name:toesWR;animation-duration:1.6s;animation-direction:normal}
@keyframes toesU{0%,100%{transform:none}50%{transform:translateY(80px) scaleY(.9)}}
@keyframes toesWL{0%,100%{transform:rotate(150deg)}50%{transform:rotate(-12deg)}}
@keyframes toesWR{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(12deg)}}
/* run on the spot */
.m-run .legL{animation-name:runL;animation-duration:.26s}.m-run .legR{animation-name:runR;animation-duration:.26s}.m-run .wl{animation-name:pumpL;animation-duration:.26s}.m-run .wr{animation-name:pumpR;animation-duration:.26s}.m-run .fig{animation-name:bobF;animation-duration:.13s}
@keyframes runL{from{transform:rotate(-24deg) translateY(-14px)}to{transform:rotate(18deg)}}
@keyframes runR{from{transform:rotate(18deg)}to{transform:rotate(-24deg) translateY(-14px)}}
@keyframes pumpL{from{transform:rotate(-15deg)}to{transform:rotate(55deg)}}
@keyframes pumpR{from{transform:rotate(-55deg)}to{transform:rotate(15deg)}}
/* star jumps */
.m-star .fig{animation-name:starF;animation-duration:.9s;animation-direction:normal}.m-star .wl{animation-name:starWL;animation-duration:.9s;animation-direction:normal}.m-star .wr{animation-name:starWR;animation-duration:.9s;animation-direction:normal}.m-star .legL{animation-name:starLL;animation-duration:.9s;animation-direction:normal}.m-star .legR{animation-name:starLR;animation-duration:.9s;animation-direction:normal}
@keyframes starF{0%,100%{transform:translateY(0)}50%{transform:translateY(-90px)}}
@keyframes starWL{0%,100%{transform:rotate(12deg)}50%{transform:rotate(140deg)}}
@keyframes starWR{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-140deg)}}
@keyframes starLL{0%,100%{transform:rotate(0)}50%{transform:rotate(28deg)}}
@keyframes starLR{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
/* wave (picker, intro) */
.m-wave .wr{animation-name:waveR;animation-duration:.45s}.m-wave .head{animation-name:headB;animation-duration:.9s}
@keyframes waveR{from{transform:rotate(-120deg)}to{transform:rotate(-160deg)}}
/* freeze poses */
.p-point .wr{transform:rotate(-95deg)}.p-point .wl{transform:rotate(12deg)}
.p-show .wr{transform:rotate(-122deg)}.p-show .wl{transform:rotate(12deg)}
.p-oneleg .legR{transform:rotate(-55deg)}.p-oneleg .wl{transform:rotate(92deg)}.p-oneleg .wr{transform:rotate(-92deg)}.p-oneleg .upper{transform:rotate(-4deg)}
.p-head .wl{transform:rotate(160deg)}.p-head .wr{transform:rotate(-160deg)}
.p-statue .wl{transform:rotate(8deg)}.p-statue .wr{transform:rotate(-8deg)}

.scene .ring{position:absolute;left:0;top:0;z-index:4;border-radius:50%;border:7px solid #FFC98A;box-shadow:0 0 30px 6px rgba(255,201,138,.55),inset 0 0 30px rgba(255,220,160,.35);pointer-events:none}
.scene .floor{position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,#FFF6DA 0 6%,transparent 7%),radial-gradient(circle at 80% 70%,#EAF4FF 0 8%,transparent 9%),repeating-linear-gradient(90deg,#F3EEDD 0 90px,#EFE8D2 90px 180px)}
.torch-side{display:flex;gap:14px;align-items:center}
.tsize{font-family:var(--body);font-weight:800;font-size:20px;padding:12px 18px;border-radius:16px;background:#fff;border:3px solid var(--line)}
.tsize.on{background:#FFC98A;border-color:#E9A55E}

/* finish */
.finish{display:flex;flex-direction:column;align-items:center;gap:30px}
.finish .fs{width:200px;height:200px;fill:var(--yellow);stroke:var(--yellow-d);stroke-width:1;animation:pop .5s}
.finish .ft{font-size:90px;font-weight:700}
.finish .fb{display:flex;gap:30px}

.sil svg{filter:brightness(0);opacity:.85;transition:filter .7s,opacity .7s}
.sil.show svg{filter:none;opacity:1}

@media (prefers-reduced-motion:reduce){
  .nextbtn.pulse,.move .mic{animation:none}
  .wheel-rot{transition-duration:1.6s}
}
</style>

let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]GB/i.test(v.lang)&&/female|Libby|Sonia|Kate|Serena|Hazel|Google UK English Female/i.test(v.name))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}
function say(t){if(!S.sound||!t)return;try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-GB';u.rate=.82;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
let actx=null;
function tone(seq){if(!S.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const t0=actx.currentTime+.01;seq.forEach(([f,d,st])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+st);g.gain.exponentialRampToValueAtTime(.16,t0+st+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+st+d);o.connect(g);g.connect(actx.destination);o.start(t0+st);o.stop(t0+st+d+.05)})}catch(e){}}
const sfx={good:()=>tone([[660,.18,0],[880,.2,.11],[1175,.32,.22]]),soft:()=>tone([[392,.18,0],[330,.26,.14]]),pop:()=>tone([[520,.1,0],[780,.14,.06]]),open:()=>tone([[440,.12,0],[660,.12,.08],[990,.2,.16]])};

const PRAISE=['Great!','Well done!','Super!','Good job!','Brilliant!','Yes!'];
function updStars(b){$('#starN').textContent=S.stars;if(b){const s=$('#stars');s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}}
function sparkle(){const st=$('#stage');for(let i=0;i<12;i++){const a=i/12*Math.PI*2,d=220+Math.random()*120;const sp=h(`<svg class="spark" viewBox="0 0 24 24" style="left:${800-17}px;top:${470-17}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px">${IC.star}</svg>`);sp.style.fill=['#FFD43B','#FF7EB6','#4A90FF','#3FCB6E'][i%4];st.append(sp);setTimeout(()=>sp.remove(),1100)}}
function cheer(text,speech){S.stars++;save();updStars(true);sfx.good();const c=$('#cheer');c.querySelector('.cw').textContent=text||pick(PRAISE);c.hidden=false;c.classList.remove('go');void c.offsetWidth;c.classList.add('go');sparkle();clearTimeout(cheer.t);cheer.t=setTimeout(()=>{c.hidden=true},1350);setTimeout(()=>say(speech||text||'Well done!'),250)}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;e.classList.remove('go');void e.offsetWidth;e.classList.add('go');clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},1350)}
function oops(el){sfx.soft();if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}toast('Try again!');say('Try again!')}
function badge(el,kind='check'){if(el.querySelector('.badge'))return;el.append(h(`<div class="badge ${kind==='star'?'star':''}">${ic(kind)}</div>`))}

/* ================= stage scaling ================= */
function fit(){const st=$('#stage');const vp=document.getElementById('viewport');const W=vp.clientWidth||innerWidth,H=vp.clientHeight||innerHeight;const fs=!!document.fullscreenElement;const pad=fs?0:Math.min(16,W*.02);const s=Math.min((W-pad*2)/1600,(H-pad*2)/900);st.style.transform=`translate(${(W-1600*s)/2}px,${(H-900*s)/2}px) scale(${s})`;st.classList.toggle('fs',fs)}
addEventListener('resize',fit);document.addEventListener('fullscreenchange',fit);

let RUN=0;
const later=(fn,ms)=>{const r=RUN;setTimeout(()=>{if(r===RUN)fn()},ms)};
function setPrompt(P,text,speech,auto=true){P.innerHTML='';const p=h(`<div class="prompt"><button class="spk" aria-label="Listen">${ic('son')}</button><div class="ptext"></div></div>`);p.querySelector('.ptext').textContent=text;p.querySelector('.spk').onclick=()=>say(speech||text);P.append(p);if(auto)later(()=>say(speech||text),350)}

/* generic round runner */
function roundGame(area,ctx,key,list,build,opt={}){
  const wrap=h(`<div class="rg"><div class="rg-prompt"></div><div class="rg-body"></div><div class="rg-foot"><div class="dots"></div><button class="nextbtn">Next ${ic('right')}</button></div></div>`);
  area.append(wrap);
  const P=wrap.children[0],B=wrap.children[1],D=wrap.querySelector('.dots'),N=wrap.querySelector('.nextbtn');
  let i=Math.min(S.pos[key]||0,list.length-1),tok=0;
  function dots(){D.innerHTML='';list.forEach((_,k)=>{const d=h(`<button class="dot ${k===i?'on':k<i?'past':''}" aria-label="Round ${k+1}"></button>`);d.onclick=()=>{i=k;show()};D.append(d)})}
  function show(){tok++;const my=tok;S.pos[key]=i;save();hush();B.innerHTML='';P.innerHTML='';N.classList.remove('pulse');N.style.visibility='';dots();
    const api={body:B,P,idx:i,total:list.length,prompt:(t,s,a)=>setPrompt(P,t,s,a),
      win:(text,speech)=>{if(my!==tok)return;cheer(text,speech);N.classList.add('pulse');if(opt.auto!==false)later(()=>{if(my===tok)next()},2300)},
      wrong:oops,next:()=>next()};
    build(list[i],api);}
  function next(){if(i<list.length-1){i++;show()}else finish()}
  function finish(){tok++;ctx.done();wrap.querySelector('.torch-side')?.remove();S.pos[key]=0;save();P.innerHTML='';D.innerHTML='';N.style.visibility='hidden';B.innerHTML='';
    const f=h(`<div class="finish"><svg class="fs" viewBox="0 0 24 24">${IC.star}</svg><div class="ft">All done!</div><div class="fb"><button class="bigbtn ghost">${ic('replay')} Again</button><button class="bigbtn orange">Next ${ic('right')}</button></div></div>`);
    f.querySelector('.ghost').onclick=()=>{i=0;show()};f.querySelector('.orange').onclick=()=>ctx.next();B.append(f);sparkle();say('All done! Well done!')}
  N.onclick=next;show();
}

function objBtn(it,size){const b=h(`<button class="ob" aria-label="${label(it[0],it[1])}">${obj(it[0],it[1])}</button>`);if(size)b.style.setProperty('--s',size+'px');return b}

function findTask(t,api){
  const L=label(...t.t);api.prompt(`Find the ${L}!`);
  const items=shuffle([t.t,...t.o]);const size=items.length<=3?280:items.length===4?260:items.length===5?240:220;
  const row=h('<div class="objrow"></div>');
  items.forEach(it=>{const b=objBtn(it,size);b.onclick=()=>{if(same(it,t.t)){b.classList.add('right');badge(b,'star');row.classList.add('locked');[...row.children].forEach(x=>{if(x!==b)x.classList.add('dim')});api.win('Yes!',`Yes! The ${L}!`)}else{api.wrong(b);say(`No, that's the ${label(...it)}. Try again!`)}};row.append(b)});
  api.body.append(row);
}
function missingTask(t,api){
  const box=h('<div style="display:flex;flex-direction:column;align-items:center"></div>');
  const row=h('<div class="mcards"></div>');const cards=t.items.map(it=>{const c=h(`<div class="mcard"><div class="in"><div class="f">${obj(it[0],it[1])}</div><div class="b"><img alt="" src="${IMG.face}"></div></div></div>`);c.onclick=()=>{if(!row.classList.contains('hidden'))say(label(...it))};row.append(c);return c});
  const go=h(`<button class="bigbtn orange" style="margin-top:46px">Ready?</button>`);
  box.append(row,go);api.body.append(box);
  api.prompt('Look and say!','Look and say! '+t.items.map(x=>label(...x)).join(', ')+'.');
  go.onclick=()=>{go.remove();row.classList.add('hidden');sfx.pop();cards.forEach(c=>c.classList.add('cov'));say('Close your eyes!');api.prompt('Close your eyes!',null,false);
    later(()=>{const mc=cards[t.miss];cards.forEach((c,k)=>{if(k!==t.miss)c.classList.remove('cov')});mc.classList.remove('cov');const q=h('<div class="q">?</div>');mc.querySelector('.f').append(q);
      api.prompt("What's missing?");
      const miss=t.items[t.miss];const vis=t.items.filter((_,k)=>k!==t.miss);const opts=shuffle([miss,pick(vis),t.extra]);
      const orow=h('<div class="mopts"></div>');
      opts.forEach(o=>{const b=objBtn(o);b.onclick=()=>{if(same(o,miss)){q.remove();b.classList.add('right');badge(b,'star');orow.classList.add('locked');api.win('Yes!',`Yes! The ${label(...miss)}!`)}else api.wrong(b)};orow.append(b)});
      box.append(orow)},1600)};
}
function sayTask(it,api){
  api.prompt("What's this? Say it!");
  const sent=`It's ${art(label(...it))}.`;
  const box=h(`<div class="sayit-task" style="display:flex;align-items:center;gap:60px"><div class="ob" style="--s:400px;pointer-events:auto">${obj(...it)}</div><div style="display:flex;flex-direction:column;gap:30px;align-items:flex-start"><div class="cap" style="font-size:62px;font-weight:700;min-height:76px;max-width:640px"></div><button class="bigbtn blue">${ic('son')} Listen</button><button class="bigbtn">${ic('check')} Done</button></div></div>`);
  const [l,d]=box.querySelectorAll('.bigbtn');const capEl=box.querySelector('.cap');const ob=box.querySelector('.ob');
  ob.onclick=()=>{ob.classList.remove('wiggle');void ob.offsetWidth;ob.classList.add('wiggle')};
  l.onclick=()=>{capEl.textContent=sent;say(sent)};
  d.onclick=()=>{d.disabled=true;capEl.textContent=sent;api.win('Great!',sent)};
  api.body.append(box);
}
function moveTask(m,api){
  api.prompt(m.t,m.say||m.t);
  let art_='';if(m.o)art_=`<div class="mic" style="font-size:0">${obj(...m.o)}</div>`;else if(m.c)art_=`<div class="mic"><div class="blob" style="background:${COL[m.c].f}"></div></div>`;else art_=`<div class="mic">${m.e}</div>`;
  const box=h(`<div class="move">${art_}<button class="bigbtn">${ic('check')} Done</button></div>`);
  box.querySelector('.bigbtn').onclick=e=>{e.currentTarget.disabled=true;api.win('Great!')};
  api.body.append(box);
}

function actTorch(area,ctx){
  roundGame(area,ctx,'torch',TORCH,(rd,api)=>{
    const big=()=>S.torchBig!==false;
    const lab=it=>rd.colour?label(...it):word(it[0]);
    const top=h(`<div class="torch-top"><div class="wordtag"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="#FFC98A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l-1 6H9z"/><path d="M9 9h6v11a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z"/><path d="M12 13v3"/></svg><span class="tw"></span><button class="spk" aria-label="Listen">${ic('son')}</button></div><span class="tprog"></span></div>`);
    api.P.innerHTML='';api.P.append(top);
    const TW=top.querySelector('.tw'),PR=top.querySelector('.tprog');
    const sc=h('<div class="scene"><div class="floor"></div><div class="dark"></div><div class="ring"></div></div>');
    api.body.append(sc);
    const dark=sc.querySelector('.dark'),ring=sc.querySelector('.ring');
    // place objects on a jittered 4x2 grid
    const cells=shuffle([...Array(8).keys()]);
    const items=rd.items.map((it,k)=>{const c=cells[k],col=c%4,row=Math.floor(c/4);const e=h(`<div class="hid" data-label="${lab(it)}">${obj(...it)}</div>`);sc.insertBefore(e,dark);return {it,e,col,row,jx:(Math.random()-.5)*110,jy:(Math.random()-.5)*60,found:false}});
    const order=shuffle(items);let n=0,light={x:0,y:0},busy=false;
    function layout(){const W=sc.clientWidth,H=sc.clientHeight;items.forEach(o=>{o.x=Math.min(W-95,Math.max(95,W*(o.col+.5)/4+o.jx));o.y=Math.min(H-95,Math.max(95,H*(o.row+.5)/2+o.jy));o.e.style.left=o.x+'px';o.e.style.top=o.y+'px'})}
    function setLight(x,y){light={x,y};const r=big()?170:120;dark.style.background=`radial-gradient(circle at ${x}px ${y}px, rgba(10,12,40,0) 0, rgba(10,12,40,0) ${r-14}px, rgba(14,16,48,1) ${r}px)`;ring.style.width=ring.style.height=(2*r)+'px';ring.style.transform=`translate(${x-r}px,${y-r}px)`}
    const cur=()=>order[n];
    function ask(){TW.textContent=lab(cur().it);PR.textContent=`Round ${api.idx+1} of ${api.total} · ${n}/${order.length} words`;later(()=>say(`Find the ${lab(cur().it)}!`),300)}
    top.querySelector('.spk').onclick=()=>say(lab(cur().it));
    function local(ev){const r=sc.getBoundingClientRect(),k=r.width/sc.offsetWidth;return {x:(ev.clientX-r.left)/k,y:(ev.clientY-r.top)/k}}
    let st=null;
    sc.addEventListener('pointerdown',ev=>{ev.preventDefault();const p=local(ev);st={x:p.x,y:p.y,prev:{...light},moved:false};try{sc.setPointerCapture(ev.pointerId)}catch(_){}setLight(p.x,p.y)});
    sc.addEventListener('pointermove',ev=>{const p=local(ev);if(st){if(Math.hypot(p.x-st.x,p.y-st.y)>14)st.moved=true;setLight(p.x,p.y)}else if(ev.pointerType==='mouse')setLight(p.x,p.y)});
    const up=(ev,cancel)=>{if(!st)return;const s0=st;st=null;if(cancel||s0.moved||busy)return;
      const r=big()?170:120;const p=local(ev);
      const hit=items.find(o=>!o.found&&Math.hypot(p.x-o.x,p.y-o.y)<95);
      if(!hit)return;
      // the picture must already be in the light before the tap (no blind guessing)
      if(Math.hypot(hit.x-s0.prev.x,hit.y-s0.prev.y)>r-20)return;
      if(hit===cur()){busy=true;hit.found=true;hit.e.classList.add('found');badge(hit.e,'star');n++;
        if(n<order.length){cheer('Yes!',`Yes! The ${lab(hit.it)}!`);later(()=>{busy=false;ask()},1500)}
        else{PR.textContent=`Round ${api.idx+1} of ${api.total} · ${n}/${order.length} words`;api.win('Well done!','Well done! You found them all!')}}
      else{hit.e.classList.remove('shake');void hit.e.offsetWidth;hit.e.classList.add('shake');sfx.soft();toast('Try again!');say(`That's ${rd.colour?'the '+lab(hit.it):art(word(hit.it[0]))}. Try again!`)}};
    sc.addEventListener('pointerup',ev=>up(ev,false));sc.addEventListener('pointercancel',ev=>up(ev,true));
    // light size toggle (teacher)
    const foot=api.body.parentElement.querySelector('.rg-foot');foot.querySelector('.torch-side')?.remove();
    const side=h(`<div class="torch-side"><button class="tsize" data-b="1">Big light</button><button class="tsize" data-b="0">Small light</button></div>`);
    const upd=()=>side.querySelectorAll('.tsize').forEach(b=>b.classList.toggle('on',(b.dataset.b==='1')===big()));upd();
    side.querySelectorAll('.tsize').forEach(b=>b.onclick=()=>{S.torchBig=b.dataset.b==='1';save();upd();setLight(light.x,light.y)});
    foot.insertBefore(side,foot.lastElementChild);
    requestAnimationFrame(()=>{layout();setLight(sc.clientWidth/2,sc.clientHeight/2);ask()});
  });
}

function actSort(area,ctx){

    const v=h(`<div class="sort"><div class="rg-prompt"></div><div class="shelf"></div><div class="bins"></div><div class="rg-foot"><div class="dots"></div><button class="nextbtn">Next ${ic('right')}</button></div></div>`);

    let sel=null,left=SORT[r].length;

    function place(e,it,bin,ghost){
      if(bin.dataset.c===it[1]){
        e.classList.remove('sel');e.classList.add('gone');e.style.pointerEvents='none';if(ghost)ghost.remove();

        if(left===0){later(()=>{if(my!==RUNsort)return;cheer('Well done!');N.classList.add('pulse');later(()=>{if(my===RUNsort)N.click()},2600)},500)}

        e.classList.remove('sel');sel=null;
      }
    }
    function binAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.bin'):null}
    function drag(e,it){
      let st=null,ghost=null,hot=null;
      e.addEventListener('pointerdown',ev=>{if(e.classList.contains('gone'))return;ev.preventDefault();const rr=e.getBoundingClientRect();st={x:ev.clientX,y:ev.clientY,dx:ev.clientX-rr.left,dy:ev.clientY-rr.top,w:rr.width,h:rr.height,moved:false};try{e.setPointerCapture(ev.pointerId)}catch(_){}});
      e.addEventListener('pointermove',ev=>{if(!st)return;if(!st.moved&&Math.hypot(ev.clientX-st.x,ev.clientY-st.y)>12){st.moved=true;ghost=h(`<div class="dragghost">${obj(...it)}</div>`);ghost.style.width=st.w+'px';ghost.style.height=st.h+'px';ghost.style.padding=(st.w*.07)+'px';ghost.style.borderRadius=(st.w*.22)+'px';document.body.append(ghost);e.classList.add('gone');if(sel){sel.classList.remove('sel');sel=null}}
        if(st.moved){ghost.style.transform=`translate(${ev.clientX-st.dx}px,${ev.clientY-st.dy}px)`;const b=binAt(ev.clientX,ev.clientY);if(b!==hot){if(hot)hot.classList.remove('hot');hot=b;if(hot)hot.classList.add('hot')}}});
      const end=(ev,cancel)=>{if(!st)return;const s=st;st=null;if(hot){hot.classList.remove('hot');hot=null}
        if(!s.moved){if(cancel)return;if(sel===e){e.classList.remove('sel');sel=null}else{if(sel)sel.classList.remove('sel');sel=e;e.classList.add('sel');sfx.pop();say(label(...it))}return}
        const b=cancel?null:binAt(ev.clientX,ev.clientY);const g=ghost;ghost=null;
        if(b)place(e,it,b,g);else{const rr=e.getBoundingClientRect();g.classList.add('back');g.style.transform=`translate(${rr.left}px,${rr.top}px)`;setTimeout(()=>{g.remove();e.classList.remove('gone')},360)}};
      e.addEventListener('pointerup',ev=>end(ev,false));e.addEventListener('pointercancel',ev=>end(ev,true));
      e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();if(sel)sel.classList.remove('sel');sel=e;e.classList.add('sel')}});
      e._it=it;
    }
    bins.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{if(sel)place(sel,sel._it,b,null);else{toast('Touch a picture first!');say('Touch a picture first!')}});

/* ================= dance break ================= */
const DMOVES=[{t:'Dance!',e:'💃',a:'dance'},{t:'Dance like Errol!',e:'🦅',a:'fly'},{t:'Jump and dance!',e:'🦘',a:'jump'},{t:'Spin around!',e:'🔄',a:'spin'},{t:'Dance fast!',e:'⚡',bpm:144,a:'dance'},{t:'Dance slow!',e:'🐢',bpm:84,a:'dance'},{t:'Wiggle, wiggle!',e:'🐛',a:'wiggle'},{t:'Hands up and dance!',e:'🙌',a:'handsup'}];
const DFREEZE=[{t:'Freeze!',p:'statue'},{t:'Freeze! Touch something pink!',c:'pink',p:'point'},{t:'Freeze! Show me a pencil!',o:['pencil','yellow'],p:'show'},{t:'Freeze like a statue!',p:'statue'},{t:'Freeze on one leg!',p:'oneleg'},{t:'Freeze! Point to something blue!',c:'blue',p:'point'},{t:'Freeze! Show me a book!',o:['book','green'],p:'show'},{t:'Freeze! Touch something yellow!',c:'yellow',p:'point'},{t:'Freeze! Hands on your head!',p:'head'},{t:'Freeze! Touch something green!',c:'green',p:'point'},{t:'Freeze! Show me a bag!',o:['bag','pink'],p:'show'}];
const DLEVELS=[{t:'Clap your hands!',e:'👏',a:'clap'},{t:'Stamp your feet!',e:'🦶',a:'stamp'},{t:'Jump, jump, jump!',e:'🦘',a:'jump'},{t:'Fly like Errol!',e:'🦅',a:'fly'},{t:'Touch your toes!',e:'🙇',a:'toes'},{t:'Spin around!',e:'🔄',a:'spin'},{t:'Run on the spot!',e:'🏃',a:'run'},{t:'Star jumps!',e:'⭐',a:'star'}];
function actDance(area,ctx){
  const root=h('<div class="dance"><div class="disco"></div></div>');area.append(root);
  let paused=false,endAt=0,remain=0,onEnd=null,tickCb=null,raf=0,musicBpm=0,phaseName='';
  const myRun=RUN;
  function clear(){cancelAnimationFrame(raf);onEnd=null;tickCb=null;paused=false;root.querySelectorAll(':scope>*:not(.disco)').forEach(e=>e.remove())}
  function phase(ms,cb,tick){endAt=performance.now()+ms;onEnd=cb;tickCb=tick||null;paused=false;cancelAnimationFrame(raf);
    const f=()=>{if(myRun!==RUN)return;if(!paused){const left=endAt-performance.now();if(tickCb)tickCb(Math.max(0,left));if(left<=0){const c=onEnd;onEnd=null;if(c)c();return}}raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
  function music(bpm){musicBpm=bpm;if(bpm)Music.start(bpm);else Music.stop()}
  function togglePause(btn){if(!paused){remain=endAt-performance.now();paused=true;Music.stop();hush();root.classList.add('calm');root.append(h('<div class="paused-tag">Pause</div>'));btn.innerHTML=ic('play')+' Play'}
    else{endAt=performance.now()+remain;paused=false;root.classList.remove('calm');root.querySelector('.paused-tag')?.remove();if(musicBpm)Music.start(musicBpm);btn.innerHTML=ic('pause')+' Pause'}}
  function ctl(extra){const c=h(`<div class="dctl"><button class="dbtn pz">${ic('pause')} Pause</button>${extra||''}<span class="sp"></span><span class="dcount"></span><button class="dbtn st">${ic('stop')} Stop</button></div>`);
    c.querySelector('.pz').onclick=e=>togglePause(e.currentTarget);c.querySelector('.st').onclick=()=>pick();root.append(c);return c}
  function dancer(beat){return `<div class="dancer go" style="--beat:${beat}s"><img alt="Errol" src="${IMG.bye}"></div>`}
  function vis(x){if(x.o)return obj(...x.o);if(x.c)return `<div class="blob" style="background:${COL[x.c].f}"></div>`;if(x.e)return x.e;return ''}

  /* ---- mode picker ---- */
  function pick(){clear();music(0);root.classList.remove('calm');
    const m=h(`<div class="mode-pick"><button class="mode fz"><span class="mi">❄️</span>Freeze Dance<small>Müzik durunca donun!</small></button><button class="mode lv"><span class="mi">🏆</span>Level Up<small>8 seviye hareket</small></button></div>`);
    m.querySelector('.fz').onclick=()=>freezeGame();m.querySelector('.lv').onclick=()=>levelGame();root.append(m);later(()=>say("Let's dance! Freeze Dance or Level Up?"),300)}

  /* ---- freeze dance ---- */
  let fz={};
  function freezeGame(){fz={n:0,total:8,mq:shuffle(DMOVES),fq:shuffle(DFREEZE)};countdown(dance)}
  function countdown(next){clear();music(0);const sp=h('<div class="lvsplash" style="background:radial-gradient(circle,#BDE6FF,#5B8CFF)"><div class="big">3</div><div class="sub">Get ready!</div></div>');root.append(sp);ctl();const B=sp.querySelector('.big');let k=3;say('Get ready! 3');tone([[660,.15,0]]);
    phase(3000,()=>next(),left=>{const v=Math.ceil(left/1000);if(v!==k&&v>0){k=v;B.textContent=v;say(String(v));tone([[660,.15,0]])}})}
  function dance(){clear();phaseName='dance';const m=fz.mq[fz.n%fz.mq.length];const bpm=m.bpm||118;
    const st=h(`<div class="dstage"><div class="trav"><div class="charbox" style="--b:${(60/bpm).toFixed(3)}s">${errolSVG('m-'+m.a)}</div></div><div class="dmove"><span class="em">${m.e}</span>${m.t}</div></div>`);root.append(st);
    const c=ctl(`<button class="dbtn ice fnow">❄️ Freeze now</button>`);c.querySelector('.dcount').textContent=`Freeze ${fz.n+1} / ${fz.total}`;c.querySelector('.fnow').onclick=()=>{if(!paused)freeze()};
    music(bpm);later(()=>say(m.t),200);phase(6000+Math.random()*6000,freeze)}
  function freeze(){clear();phaseName='freeze';musicBpm=0;Music.stop(true);const f=fz.fq[fz.n%fz.fq.length];fz.n++;
    const task=f.t!=='Freeze!';const txt=task?f.t.replace(/^Freeze! /,''):'';
    const v=h(`<div class="freeze"><div class="ft">FREEZE!</div><div class="charbox">${errolSVG('ice p-'+(f.p||'statue'),f.o)}</div>${task?`<div class="task">${(f.o||f.c||f.e)?`<span class="fzv">${vis(f)}</span>`:''}<span>${txt}</span></div>`:''}</div>`);
    
    for(let i=0;i<14;i++){const fl=h(`<span class="flake" style="left:${Math.random()*100}%;animation-duration:${3+Math.random()*4}s;animation-delay:${-Math.random()*5}s">❄</span>`);v.append(fl)}
    root.append(v);const last=fz.n>=fz.total;
    const c=ctl(`<button class="dbtn go dgo">${ic('play')} ${last?'Finish':'Dance!'}</button>`);c.querySelector('.dcount').textContent=`Freeze ${fz.n} / ${fz.total}`;
    const nxt=()=>last?finish('Great dancing!'):dance();c.querySelector('.dgo').onclick=()=>{if(!paused)nxt()};
    later(()=>say(f.t),350);phase(task?6000:4000,nxt)}

  /* ---- level up ---- */
  let lv={};
  function levelGame(){lv={i:0,secs:S.lvSecs||15};levelIntro()}
  function lvBar(){return `<div class="lvbar">${DLEVELS.map((_,k)=>`<i class="${k<lv.i?'on':k===lv.i?'now':''}"></i>`).join('')}</div>`}
  function levelIntro(){clear();music(0);const L=DLEVELS[lv.i];
    root.append(h(`<div class="lvsplash"><div class="big">LEVEL ${lv.i+1}</div><div class="sub"><span class="charbox" style="height:200px;--b:.5s">${errolSVG('m-'+L.a)}</span>${L.t}</div></div>`));ctl();Music.fanfare();later(()=>say(`Level ${lv.i+1}! ${L.t}`),400);phase(3200,exercise)}
  function exercise(){clear();const L=DLEVELS[lv.i];const bpm=100+lv.i*7;const R=180,C=2*Math.PI*R;
    const st=h(`<div class="dstage">${lvBar()}<div class="lvrow"><div class="charbox" style="--b:${(60/bpm).toFixed(3)}s">${errolSVG('m-'+L.a)}</div><div class="ringwrap sm" style="--beat:${(60/bpm).toFixed(3)}s"><svg viewBox="0 0 390 390"><circle cx="195" cy="195" r="${R}" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.25)" stroke-width="18"/><circle class="arc" cx="195" cy="195" r="${R}" fill="none" stroke="#FFD43B" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="em"><span>${L.e}</span></div></div></div><div class="dmove">${L.t}</div></div>`);root.append(st);
    const secBtns=[10,15,20].map(x=>`<button class="dbtn sec ${x===lv.secs?'sel':''}" data-s="${x}">${x}s</button>`).join('');
    const c=ctl(`<button class="dbtn skip">${ic('skip')} Skip</button>${secBtns}`);c.querySelector('.dcount').textContent=`Level ${lv.i+1} / ${DLEVELS.length}`;
    c.querySelector('.skip').onclick=()=>{if(!paused)levelUp()};
    c.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{const x=+b.dataset.s;const used=lv.secs*1000-(endAt-performance.now());lv.secs=x;S.lvSecs=x;save();endAt=performance.now()+Math.max(1500,x*1000-used);c.querySelectorAll('.sec').forEach(y=>y.classList.toggle('sel',y===b))});
    const arc=st.querySelector('.arc');music(bpm);
    phase(lv.secs*1000,levelUp,left=>{arc.setAttribute('stroke-dashoffset',(C*(1-left/(lv.secs*1000))).toFixed(1))})}
  function levelUp(){clear();Music.stop();lv.i++;const done=lv.i>=DLEVELS.length;
    if(done){finish('Super star!');return}
    root.append(h(`<div class="lvsplash" style="background:radial-gradient(circle,#D7FFE4,#3FCB6E)"><div class="big" style="-webkit-text-stroke-color:#229A4C;text-shadow:0 10px 0 #1B7A3C">LEVEL UP!</div>${lvBar()}</div>`));ctl();
    S.stars++;save();updStars(true);sparkle();Music.fanfare();later(()=>say('Level up!'),250);phase(2600,levelIntro)}

  function finish(t){clear();music(0);ctx.done();S.stars++;save();updStars(true);sparkle();Music.fanfare();
    const f=h(`<div class="dfin"><div class="charbox" style="--b:.45s">${errolSVG('m-dance')}</div><div class="ft">${t}</div><div class="fb"><button class="bigbtn ghost">${ic('replay')} Again</button><button class="bigbtn orange">${ic('note')} Other game</button></div></div>`);
    f.querySelector('.ghost').onclick=()=>t==='Super star!'?levelGame():freezeGame();f.querySelector('.orange').onclick=()=>pick();root.append(f);later(()=>say(t==='Super star!'?"You're a super star!":'Great dancing!'),300)}
  pick();
}

/* ================= navigation ================= */
function go(i){
  RUN++;RUNsort++;hush();Music.stop();ILUDE_TO=null;document.querySelectorAll('.dragghost,.modal').forEach(e=>e.remove());
  S.cur=i;save();const area=$('#area');area.innerHTML='';
  const a=ACTS[i];
  $('#tName').textContent=a?a.en:'Errol the Eagle';
  $('#tMeta').textContent=a?`${i+1}/${ACTS.length}`:'Lesson 10';
  $('#bPrev').disabled=i<0;$('#bPrev').style.opacity=i<0?.35:1;
  if(!a){home(area);return}
  const ctx={done(){if(!S.done[a.id]){S.done[a.id]=true;save()}},next(){goNext(i)}};
  a.run(area,ctx);
}
$('#bHome').innerHTML=ic('home');$('#bPrev').innerHTML=ic('left');$('#bNext').innerHTML=ic('right');$('#bReplay').innerHTML=ic('replay');$('#bHelp').innerHTML=ic('help');$('#bDance').innerHTML=ic('note');$('#bDance').onclick=()=>go(ACTS.findIndex(a=>a.id==='dance'));$('#bFull').innerHTML=ic('full');
function soundBtn(){const b=$('#bSound');b.innerHTML=ic(S.sound?'son':'soff');b.classList.toggle('off',!S.sound)}
$('#bHome').onclick=()=>go(-1);
$('#bPrev').onclick=()=>{if(S.cur>=0)go(S.cur-1)};
$('#bNext').onclick=()=>{if(ILUDE_TO!==null){go(ILUDE_TO);return}goNext(S.cur)};
$('#bReplay').onclick=()=>{const a=ACTS[S.cur];if(!a){go(-1);return}S.pos[a.id]=0;if(a.id==='sort')S.pos.sort=0;if(a.id==='wheel'){S.wheel.sets={}};save();go(S.cur)};
$('#bSound').onclick=()=>{S.sound=!S.sound;save();soundBtn();if(!S.sound){hush();Music.stop()}else say('Sound on!')};
$('#bHelp').onclick=help;
$('#bFull').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>toast('Full screen is not available'))}}catch(e){}};
document.addEventListener('pointerdown',()=>{try{if(actx&&actx.state==='suspended')actx.resume()}catch(e){}},{passive:true});

soundBtn();updStars();fit();go(typeof S.cur==='number'&&S.cur<ACTS.length?S.cur:-1);
</script>
