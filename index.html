<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="My Family: interactive English games for young learners (family words) with a speaking step, magic name picker and star rewards."><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>[hidden]{display:none!important}</style><title>My Family for Teachers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one fixed 16:9 classroom board (1600×900) scaled to fit any screen; slim tool bar on top, one big play area below.
   Deliberately single look: the pastel world of the "My Family" slides (cream + sky, yellow-framed boxes). */
:root{
  --cream:#FFF6D6; --sky:#E8F6FD; --ink:#2F2D52; --muted:#6B6890;
  --pink:#FF5F92; --blue:#3FB2E6; --purple:#8C64DB; --green:#4CC48E; --yellow:#FFD54A; --orange:#FF8A3D;
  --white:#FFFFFF; --red:#EF5350;
  --display:'Baloo 2','Fredoka','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#board{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;background:var(--cream);border-radius:28px;overflow:hidden;
  box-shadow:0 10px 40px rgba(47,45,82,.15);display:flex;flex-direction:column}
#board.alt{background:var(--sky)}
button{font-family:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:5px solid var(--orange);outline-offset:3px}
img{max-width:100%;-webkit-user-drag:none;user-select:none}
.dots-bg{position:absolute;border-radius:50%;pointer-events:none;opacity:.9}

/* top bar */
#bar{height:84px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;background:rgba(255,255,255,.75);border-bottom:4px solid var(--yellow);position:relative;z-index:5}
.tb{width:60px;height:60px;border-radius:18px;border:none;background:var(--white);box-shadow:0 3px 0 rgba(47,45,82,.15);display:grid;place-items:center;color:var(--ink)}
.tb svg{width:32px;height:32px}
.tb:active{transform:translateY(2px);box-shadow:none}
.tb.off{opacity:.45}
#title{flex:1;min-width:0;font:700 40px/1 var(--display);color:var(--pink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
#stars{display:flex;align-items:center;gap:6px;font:800 34px var(--display);color:var(--ink);background:var(--white);border-radius:30px;padding:4px 20px 4px 12px;box-shadow:0 3px 0 rgba(47,45,82,.15)}
#stars svg{width:38px;height:38px}
#stars.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.3)}}

#area{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
.play{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:20px 40px}
.foot{height:96px;flex:none;display:flex;align-items:center;justify-content:center;gap:14px;position:relative}
.rdots{display:flex;gap:10px}
.rdot{width:22px;height:22px;border-radius:50%;border:3px solid var(--purple);background:var(--white);padding:0}
.rdot.on{background:var(--purple)}
.rdot.done{background:var(--green);border-color:var(--green)}
.nextbtn{position:absolute;right:34px;bottom:16px}
.bigbtn{border:none;border-radius:40px;padding:14px 34px;font:700 34px var(--display);color:var(--white);background:var(--orange);box-shadow:0 6px 0 #D96A24;display:inline-flex;align-items:center;gap:10px}
.bigbtn svg{width:32px;height:32px}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #D96A24}
.bigbtn.pinkb{background:var(--pink);box-shadow:0 6px 0 #D9467A}
.bigbtn.blueb{background:var(--blue);box-shadow:0 6px 0 #2A8FBD}
.bigbtn.greenb{background:var(--green);box-shadow:0 6px 0 #33A072}
.bigbtn.purpleb{background:var(--purple);box-shadow:0 6px 0 #6E49B8}
.prompt{font:700 46px/1.1 var(--display);color:var(--ink);text-align:center;margin:0}
.yb{background:var(--white);border:6px solid var(--yellow);padding:18px 26px;font:800 40px/1.25 var(--body);color:var(--ink)}
.card{background:var(--white);border-radius:30px;overflow:hidden;box-shadow:0 6px 0 rgba(47,45,82,.12);border:none;padding:0}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.spk{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--blue);color:var(--white);flex:none}
.spk svg{width:30px;height:30px}
.tr{font:800 30px var(--body);color:var(--purple)}
.hideTr .tr{visibility:hidden}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.wiggle{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.good{outline:10px solid var(--green);outline-offset:-10px}
.bad{opacity:.35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* menu */
.menu{flex:1;display:flex;flex-direction:column;padding:26px 46px 20px;gap:18px;min-height:0}
.mhead{display:flex;align-items:center;gap:24px}
.mhead h1{margin:0;font:800 84px/1 var(--display);color:var(--pink)}
.mhead p{margin:0;font:800 30px var(--body);color:var(--ink)}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:20px;min-height:0}
.tile{position:relative;border:none;border-radius:26px;background:var(--white);box-shadow:0 6px 0 rgba(47,45,82,.12);display:flex;flex-direction:column;overflow:hidden;padding:0;text-align:left}
.tile .th{flex:1;min-height:0;background-size:cover;background-position:center}
.tile .tl{padding:10px 16px 12px;font:700 30px/1.05 var(--display);color:var(--ink);display:flex;gap:10px;align-items:center}
.tile .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--white);font:800 22px var(--body)}
.tile .ck{position:absolute;top:10px;right:10px;width:50px;height:50px;border-radius:50%;background:var(--green);color:var(--white);display:grid;place-items:center}
.tile .ck svg{width:30px;height:30px}
.mfoot{display:flex;align-items:center;gap:16px}
.mfoot .sp{flex:1}
.pill{border:3px solid var(--purple);background:var(--white);color:var(--purple);border-radius:30px;padding:8px 20px;font:800 24px var(--body)}
.pill.on{background:var(--purple);color:var(--white)}

/* modal */
#modal{position:absolute;inset:0;background:rgba(47,45,82,.45);display:flex;align-items:center;justify-content:center;z-index:50}
#modal .box{background:var(--white);border-radius:30px;padding:34px 40px;max-width:1000px;border:6px solid var(--yellow)}
#modal h2{margin:0 0 12px;font:800 40px var(--display);color:var(--purple)}
#modal p,#modal li{font:700 28px/1.45 var(--body);color:var(--ink);margin:0 0 8px}
#modal ul{margin:0 0 16px;padding-left:30px}
#modal .row{display:flex;gap:14px;justify-content:flex-end;margin-top:18px}

/* celebration */
#burst{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.bstar{position:absolute;width:60px;height:60px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.4);opacity:0}}
.donebox{display:flex;flex-direction:column;align-items:center;gap:22px}
.donebox .big{font:800 90px/1 var(--display);color:var(--pink)}

/* look & listen */
.ll{display:flex;align-items:center;gap:60px;width:100%;height:100%}
.ll .pic{width:560px;height:574px;flex:none;cursor:pointer}
.ll .txt{flex:1;display:flex;flex-direction:column;gap:22px;align-items:flex-start;min-width:0}
.ll .word{font:800 120px/1 var(--display);border:none;background:none;padding:0;display:flex;align-items:center;gap:20px}
.ll .yb{display:flex;align-items:center;gap:18px;border-radius:0;cursor:pointer;text-align:left}

/* grids of choices */
.choices{display:flex;gap:34px;justify-content:center}
.choice{width:320px;height:328px}
.choice.sm{width:250px;height:256px}

/* sort */
.sort{display:flex;flex-direction:column;width:100%;height:100%;gap:18px}
.pool{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;min-height:180px}
.it{width:160px;height:164px;touch-action:none;cursor:grab;position:relative;z-index:2}
.it.sel{outline:8px solid var(--orange);outline-offset:-8px}
.it.drag{z-index:30;cursor:grabbing;box-shadow:0 18px 30px rgba(47,45,82,.3)}
.bins{flex:1;display:flex;gap:30px;min-height:0}
.bin{flex:1;border-radius:30px;border:6px dashed;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px;background:rgba(255,255,255,.6)}
.bin h3{margin:0;font:800 50px/1 var(--display)}
.bin .got{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bin .got .card{width:110px;height:113px}
.bin.hover{background:var(--white)}

/* fill */
.fill{display:flex;gap:56px;align-items:center;width:100%}
.fill .pic{width:470px;height:482px;flex:none}
.fill .right{flex:1;display:flex;flex-direction:column;gap:30px}
.blank{display:inline-block;min-width:240px;border-bottom:6px solid var(--ink);text-align:center;color:var(--green)}
.wbtns{display:flex;gap:18px;flex-wrap:wrap}
.wbtn{border:none;border-radius:24px;background:var(--white);padding:16px 30px;font:800 40px var(--body);box-shadow:0 5px 0 rgba(47,45,82,.15);color:var(--ink)}
.wbtn.good{outline-offset:2px;outline-width:6px;background:#E3F8EE}

.ask{border:none;background:var(--white);border:6px solid var(--yellow);padding:14px 30px 14px 16px;display:flex;align-items:center;gap:18px;font:800 52px var(--display);color:var(--ink)}
.ask .spk{width:72px;height:72px;background:var(--purple)}
.ask .spk svg{width:42px;height:42px}
.sbtns{display:flex;gap:40px}
.sbtn{width:160px;height:160px;border-radius:50%;border:none;background:var(--c);box-shadow:0 8px 0 var(--s);color:var(--white);display:grid;place-items:center;transition:transform .15s}
.sbtn svg{width:96px;height:96px}
.sbtn:active{transform:translateY(5px);box-shadow:0 3px 0 var(--s)}
.sbtn.playing{animation:pulse .6s infinite alternate}
.sbtn.good{outline:12px solid var(--green);outline-offset:6px}
.sbtn{position:relative}
.sbtn .tick{position:absolute;top:-6px;right:-6px;width:56px;height:56px;border-radius:50%;background:var(--white);color:var(--green);display:none;place-items:center;box-shadow:0 3px 0 rgba(47,45,82,.15)}
.sbtn .tick svg{width:38px;height:38px}
.sbtn.heard .tick{display:grid}
.scol{display:flex;flex-direction:column;align-items:center;gap:20px}
.scol.bad{opacity:.35}
.pick{width:120px;height:120px;border-radius:30px;border:6px solid var(--c);background:var(--white);color:var(--c);display:grid;place-items:center;box-shadow:0 6px 0 var(--s)}
.pick svg{width:72px;height:72px}
.pick:disabled{opacity:.25;box-shadow:none;cursor:default}
.ready .pick:not(:disabled){animation:pulse .7s 3 alternate}
.pick.good,.pick.good:disabled{opacity:1;background:var(--green);border-color:var(--green);color:var(--white);box-shadow:0 6px 0 #33A072}
.hint{font:800 40px var(--display);color:var(--purple)}
@keyframes pulse{to{transform:scale(1.1)}}
.ans{font:800 44px/1.3 var(--body);text-align:center;color:var(--ink)}
/* class chip + class screen */
.clschip{border:none;border-radius:30px;background:var(--purple);color:var(--white);font:800 30px var(--display);padding:6px 22px;height:60px;box-shadow:0 3px 0 #6E49B8;display:flex;align-items:center;gap:8px}
.clschip:active{transform:translateY(2px);box-shadow:none}
.clsscreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.clsscreen h1{margin:0;font:800 96px/1 var(--display);color:var(--pink)}
.clsrow{display:flex;gap:50px;flex-wrap:wrap;justify-content:center}
.clsbtn{width:400px;height:300px;border:none;border-radius:40px;color:var(--white);font:800 120px/1 var(--display);box-shadow:0 12px 0 var(--s);background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.clsbtn small{font:800 26px var(--body);opacity:.9}
.clsbtn:active{transform:translateY(8px);box-shadow:0 4px 0 var(--s)}
.homelink{border:none;background:none;font:800 28px var(--body);color:var(--muted);text-decoration:underline}
/* magic name picker */
.mp{position:absolute;inset:0;z-index:48;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,#3B2A78 0%,#1E1646 55%,#110C2A 100%);animation:gin .25s}
.mpc{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none}
.mphead{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;z-index:8}
.mptitle{display:flex;align-items:center;gap:14px;font:800 52px var(--display);color:#FFE07A}
.mptitle svg{width:52px;height:52px}
.mpx{width:72px;height:72px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.mpx svg{width:40px;height:40px}
.orbit{position:absolute;inset:0;pointer-events:none}
.nb{position:absolute;left:0;top:0;pointer-events:auto;border:none;border-radius:40px;padding:10px 26px;font-family:var(--display);font-weight:800;color:#fff;background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 22px color-mix(in srgb,var(--c) 70%,transparent);white-space:nowrap;display:flex;align-items:center;gap:8px;will-change:transform}
.nb.done{filter:saturate(.35) brightness(.85)}
.nb.abs{background:#5E5A78;color:#B9B5D6;text-decoration:line-through;box-shadow:none}
.nb .ok{color:#FFE07A}
.nb .zz{font-size:.6em;opacity:.8}
.nb.cur{outline:6px solid #FFE07A;filter:none}
.hat{position:absolute;left:609px;top:378px;width:382px;height:300px;border:none;background:none;padding:0;z-index:5;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.hat.shake{animation:hatshake .65s}
@keyframes hatshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg) translateY(-6px)}35%{transform:rotate(6deg)}55%{transform:rotate(-5deg) translateY(-4px)}75%{transform:rotate(4deg)}}
.winner{position:absolute;left:800px;top:250px;z-index:9;width:0;height:0}
.winner .rays{position:absolute;left:-330px;top:-330px;width:660px;height:660px;border-radius:50%;background:repeating-conic-gradient(rgba(255,224,122,.55) 0deg 10deg,rgba(255,224,122,0) 10deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wcard{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:#fff;border:8px solid #FFD54A;border-radius:40px;padding:26px 40px 26px 56px;display:flex;align-items:center;gap:26px;box-shadow:0 0 60px rgba(255,213,74,.8),0 14px 0 rgba(0,0,0,.2)}
.wname{font:800 120px/1 var(--display);color:var(--pink);white-space:nowrap}
.wsay{width:84px;height:84px;border-radius:50%;border:none;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.wsay svg{width:48px;height:48px}
.winner.show .wcard{animation:rise .9s cubic-bezier(.2,1.4,.4,1)}
.winner.show .rays{animation:spin 9s linear infinite,fadein .6s}
@keyframes rise{0%{transform:translate(-50%,180px) scale(.1);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes fadein{from{opacity:0}}
.mpbar{position:absolute;left:0;right:0;bottom:58px;display:flex;justify-content:center;gap:20px;z-index:8}
.bigbtn.magic{background:linear-gradient(90deg,#FF5F92,#8C64DB);box-shadow:0 6px 0 #5B3FA8;font-size:40px;padding:14px 40px}
.mpinfo{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:700 22px var(--body);color:#C9C3EE;z-index:8}
@media (prefers-reduced-motion:reduce){.winner .rays{animation:none}}
/* star reward mode */
.mp.gold{background:radial-gradient(ellipse at 50% 70%,#7A4A12 0%,#3E2266 55%,#1B1035 100%)}
.nb.good{outline:6px solid #FFD54A;box-shadow:0 0 30px #FFD54A,0 6px 0 rgba(0,0,0,.25);filter:none}
.nb .rc{background:#FFD54A;color:#5B3FA8;border-radius:16px;padding:0 10px;font-size:.72em;margin-left:4px}
.wcard.gold{background:linear-gradient(#FFFBEA,#FFE9A3);border-color:#F2B51C}
.wcard .wsub{display:none;font:800 44px var(--display);color:#E59A00;white-space:nowrap}
.wcard.gold .wsub{display:block}
.wtext{display:flex;flex-direction:column;align-items:center}
.bigbtn.starb{background:linear-gradient(90deg,#F2B51C,#FF8A3D);box-shadow:0 6px 0 #B9770E}
/* name picker */
.picker{position:absolute;inset:0;z-index:48;background:rgba(47,45,82,.6);display:flex;align-items:center;justify-content:center;animation:gin .2s}
.pbox2{background:var(--cream);border:8px solid var(--yellow);border-radius:40px;width:1300px;padding:30px 40px;display:flex;flex-direction:column;gap:22px;align-items:center}
.phead{display:flex;width:100%;align-items:center;gap:16px}
.phead h2{margin:0;flex:1;font:800 54px var(--display);color:var(--purple)}
.pname{width:100%;height:220px;border-radius:30px;background:var(--white);border:6px solid var(--purple);display:grid;place-items:center;font:800 130px/1 var(--display);color:var(--ink);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 20px}
.pname.roll{color:var(--muted)}
.pname.land{animation:pop .5s;color:var(--pink)}
.prow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pchips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:210px;overflow:auto;width:100%}
.pchip{border:3px solid var(--purple);background:var(--white);color:var(--ink);border-radius:24px;padding:6px 16px;font:800 24px var(--body)}
.pchip.done{opacity:.4}
.pchip.abs{text-decoration:line-through;border-color:var(--red);color:var(--red);opacity:.7}
.pchip.cur{background:var(--pink);border-color:var(--pink);color:var(--white);opacity:1}
.pinfo{font:700 22px/1.35 var(--body);color:var(--muted);text-align:center}
.gname{font:800 60px var(--display);color:var(--purple)}
.namesbox{width:100%;height:220px;font:700 24px/1.4 var(--body);border:3px solid var(--purple);border-radius:16px;padding:10px 14px;resize:vertical;color:var(--ink);background:var(--white)}
.clsin{font:800 24px var(--body);border:3px solid var(--purple);border-radius:14px;padding:6px 12px;width:420px;color:var(--ink);background:var(--white)}
/* settings tile + modal */
.tile.set{background:var(--purple);color:var(--white);align-items:center;justify-content:center;gap:10px}
.tile.set .gear{width:110px;height:110px;color:var(--white)}
.tile.set .tl{color:var(--white);justify-content:center}
#modal .box.wide{max-width:1440px;width:1440px;max-height:820px;overflow:auto}
.srow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 16px}
.srow .lab{font:800 28px var(--body);color:var(--ink);min-width:300px}
.srow .note{font:700 22px/1.35 var(--body);color:var(--muted);flex-basis:100%;margin-left:316px;margin-top:-6px}
.seg{display:inline-flex;border:3px solid var(--purple);border-radius:30px;overflow:hidden}
.seg button{border:none;background:var(--white);color:var(--purple);font:800 24px var(--body);padding:8px 22px}
.seg button.on{background:var(--purple);color:var(--white)}
.wchips{display:grid;grid-template-columns:repeat(11,1fr);gap:10px;margin:6px 0 4px}
.wchip{border:4px solid var(--white);border-radius:18px;background:var(--white);padding:0 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 18px/1.1 var(--body);color:var(--muted);opacity:.45;box-shadow:0 3px 0 rgba(47,45,82,.12)}
.wchip img{width:100%;height:96px;object-fit:cover;border-radius:14px 14px 0 0}
.wchip.on{opacity:1;border-color:var(--green);color:var(--ink)}
.warnbar{display:flex;align-items:center;gap:14px;background:#FFE3E3;border:4px solid var(--red);border-radius:20px;padding:10px 20px;font:800 24px/1.3 var(--body);color:var(--ink)}
.warnbar svg{width:40px;height:40px;color:var(--red);flex:none}
/* caption: shown when the device cannot speak, so the teacher/parent reads it aloud */

function vScore(v){let s=0;const n=v.name||'';if(/natural|neural|online|premium|enhanced/i.test(n))s+=40;if(FEMALE.test(n))s+=30;if(MALE.test(n))s-=40;if(/google/i.test(n))s+=8;if(/en[-_]GB/i.test(v.lang))s+=6;else if(/en[-_](US|AU|IE|CA)/i.test(v.lang))s+=3;return s}

  voice=(S.voiceName&&S.voiceName!=='__rec'&&en.find(v=>v.name===S.voiceName))||en[0]||null;
  trVoice=vs.filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a))[0]||null}catch(e){}}

  try{stopClips();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(n);if(trVoice){u.voice=trVoice;u.lang=trVoice.lang}else u.lang='tr-TR';u.rate=S.rate||.9;u.pitch=1;
    if(tk){let fired=false;const go2=()=>{if(!fired){fired=true;playClips(tk)}};u.onend=go2;setTimeout(go2,Math.max(1400,n.length*160));speechSynthesis.speak(u);return}
    speechSynthesis.speak(u);

    const N=bubbles.length||1;bubbles.forEach(b=>{const a=base+b.i*2*Math.PI/N;const ox=CX+RX*Math.cos(a),oy=CY+RY*Math.sin(a);const k=ease(Math.max(0,Math.min(1,b.k)));

/* star rewards: today's well-behaved list (clears itself the next day) and each child's star count */
const goodNow=()=>{const g=S.good[S.cls];return g&&g.date===today()?g.list:[]};

/* ---------- 4 he or she sort ---------- */

    <div class="bin" data-g="he" style="border-color:var(--blue)"><h3 style="color:var(--blue)">He</h3><div class="got"></div></div></div></div>`);
  play.append(v);
  const pool=v.querySelector('.pool');const bins=[...v.querySelectorAll('.bin')];const items=SONE().length>=6?SONE():fillUp(SONE(),ONE,6);let sel=null,left=items.length,dragging=null;
  const scale=()=>$('#board').getBoundingClientRect().width/1600;
  function drop(el,x,bin){
    if(bin.dataset.g===x.g){el.remove();const c=h(`<div class="card"><img src="${IMG[x.id]}" alt="${x.w}"></div>`);bin.querySelector('.got').append(c);ding();left--;sel=null;const last=left===0;
      talk({img:x.id,...QA(x),mode:'ask'},()=>{addStar(1,c);if(last){ctx.done();later(()=>{play.innerHTML='';const b=h(`<div class="donebox"><div class="big">Well done!</div><div style="display:flex;gap:20px"><button class="bigbtn blueb">${ic('again')} Again</button><button class="bigbtn">Next game ${ic('right')}</button></div></div>`);play.append(b);b.querySelector('.blueb').onclick=()=>go(cur);b.querySelector('.bigbtn:not(.blueb)').onclick=ctx.next;say('Well done!')},800)}})}
    else{el.style.transform='';el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');buzz();say(`No. ${A(x)}`)}
  }
  function binAt(cx,cy){return bins.find(b=>{const r=b.getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom})}
  shuffle(items).forEach(x=>{const el=h(`<div class="card it" role="button" tabindex="0" aria-label="${x.w}"><img src="${IMG[x.id]}" alt="${x.w}"></div>`);pool.append(el);
    let sx,sy,moved=false,dn=false;
    el.addEventListener('pointerdown',e=>{if(dragging&&dragging!==el)return;dragging=el;dn=true;moved=false;sx=e.clientX;sy=e.clientY;try{el.setPointerCapture(e.pointerId)}catch(_){}});
    el.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<8)return;moved=true;el.classList.add('drag');const k=scale();el.style.transform=`translate(${dx/k}px,${dy/k}px)`;
      const b=binAt(e.clientX,e.clientY);bins.forEach(z=>z.classList.toggle('hover',z===b))});
    const up=e=>{if(!dn)return;dn=false;dragging=null;el.classList.remove('drag');bins.forEach(z=>z.classList.remove('hover'));
      if(moved){const b=binAt(e.clientX,e.clientY);if(b)drop(el,x,b);else el.style.transform=''}
      else{pool.querySelectorAll('.it').forEach(z=>z.classList.remove('sel'));if(sel&&sel.el===el){sel=null}else{sel={el,x};el.classList.add('sel');say(x.w)}}};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',()=>{dn=false;dragging=null;el.classList.remove('drag');el.style.transform=''});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pool.querySelectorAll('.it').forEach(z=>z.classList.remove('sel'));sel={el,x};el.classList.add('sel');say(x.w)}});
  });
  bins.forEach(b=>{b.tabIndex=0;b.setAttribute('role','button');const act=()=>{if(sel){sel.el.classList.remove('sel');drop(sel.el,sel.x,b)}else say(b.dataset.g==='she'?'She':'He')};b.addEventListener('click',e=>{if(e.target.closest('.it'))return;act()});b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}})});
  later(()=>say('Who is she? Who is he?'),350);

/* ---------- flashlight ---------- */
function actFlash(area,ctx){
  const tg=targets(SEL(),8);
  rounds(area,ctx,tg,(x,api)=>{
    const ask=`Find the ${x.w}!`;
    const v=h(`<div class="flw"><div class="ftop"><button class="fcard" aria-label="${ask}"><svg class="torch" viewBox="0 0 24 24">${I.torch}</svg>${x.w}<span class="spk">${ic('son')}</span></button></div>
      <div class="fl"><div class="dark"></div><div class="ring"></div></div></div>`);
    api.play.append(v);
    const fl=v.querySelector('.fl'),ring=v.querySelector('.ring');
    // scene: target + 7 others, one per cell of a 4×2 grid with a little jitter
    const scene=shuffle([x,...pick(W.filter(o=>o!==x),7)]);
    const FW=1520,FH=fl.clientHeight||560,PW=190,PH=195,cw=FW/4,ch=FH/2;
    const pics=scene.map((o,i)=>{const c=i%4,r=Math.floor(i/4);
      const px=c*cw+(cw-PW)/2+(Math.random()-.5)*Math.max(0,cw-PW-40),py=r*ch+(ch-PH)/2+(Math.random()-.5)*Math.max(0,ch-PH-30);
      const el=h(`<div class="fp" style="left:${px}px;top:${py}px"><img src="${IMG[o.id]}" alt=""></div>`);fl.insertBefore(el,fl.querySelector('.dark'));
      return{o,el,cx:px+PW/2,cy:py+PH/2}});
    let lx=FW/2,ly=FH-90,over=false,waitT=0;
    // start the light on the darkest spot: the candidate point farthest from every picture
    {let best=-1;for(let gx=0;gx<=8;gx++)for(let gy=0;gy<=4;gy++){const X=60+gx*(FW-120)/8,Y=50+gy*(FH-100)/4;const d=Math.min(...pics.map(p=>Math.hypot(p.cx-X,p.cy-Y)));if(d>best){best=d;lx=X;ly=Y}}}
    const setL=(X,Y)=>{lx=Math.max(0,Math.min(FW,X));ly=Math.max(0,Math.min(FH,Y));fl.style.setProperty('--x',lx+'px');fl.style.setProperty('--y',ly+'px');ring.style.left=lx+'px';ring.style.top=ly+'px'};
    setL(lx,ly);
    const toLocal=e=>{const r=fl.getBoundingClientRect(),k=r.width/FW;return[(e.clientX-r.left)/k,(e.clientY-r.top)/k]};
    const litAt=(X,Y)=>pics.find(p=>Math.abs(p.cx-X)<PW/2&&Math.abs(p.cy-Y)<PH/2&&Math.hypot(p.cx-lx,p.cy-ly)<150);
    let down=null;
    fl.addEventListener('pointerdown',e=>{if(over||Date.now()<waitT)return;const[X,Y]=toLocal(e);down={X,Y,hit:litAt(X,Y),moved:false};try{fl.setPointerCapture(e.pointerId)}catch(_){}
      if(!down.hit)setL(X,Y)});
    fl.addEventListener('pointermove',e=>{if(over||!down)return;const[X,Y]=toLocal(e);if(Math.hypot(X-down.X,Y-down.Y)>12)down.moved=true;if(down.moved||!down.hit)setL(X,Y)});
    const up=()=>{if(!down)return;const d=down;down=null;if(over||d.moved||!d.hit)return;
      const p=d.hit;
      if(p.o===x){over=true;fl.classList.add('found');p.el.classList.add('good');ding();later(()=>talk({img:x.id,...QA(x),mode:'ask'},()=>api.solve(p.el)),900)}
      else{p.el.classList.remove('shake');void p.el.offsetWidth;p.el.classList.add('shake');buzz();waitT=Date.now()+2000;later(()=>say(p.o.g==='both'?`That's my cousin! ${ask}`:`That's my ${p.o.w}! ${ask}`),300)}};
    fl.addEventListener('pointerup',up);fl.addEventListener('pointercancel',()=>{down=null});
    v.querySelector('.fcard').onclick=()=>say(ask);
    later(()=>say(ask),350);
  });
}

/* ---------- 9 wheel ---------- */
function actWheel(area,ctx){
  const play=h('<div class="play"></div>');area.append(play);
  let WH=SEL();while(WH.length<6)WH=WH.concat(SEL()); /* few chosen words -> each appears more than once */const N=WH.length,seg=360/N,R=320,cols=['#FF9AB8','#8ED3F2','#BBA2EC','#8EDDB9','#FFE07A'];
  let svg=`<svg id="wheel" viewBox="-320 -320 640 640"><defs>`;
  WH.forEach((x,i)=>{svg+=`<clipPath id="cp${i}"><circle r="58"/></clipPath>`});svg+='</defs>';
  const P=(a,r)=>[r*Math.sin(a*Math.PI/180),-r*Math.cos(a*Math.PI/180)];
  WH.forEach((x,i)=>{const a0=i*seg,a1=(i+1)*seg,[x0,y0]=P(a0,R-6),[x1,y1]=P(a1,R-6),[cx,cy]=P(a0+seg/2,R-110);
    svg+=`<path d="M0 0 L${x0} ${y0} A${R-6} ${R-6} 0 0 1 ${x1} ${y1}Z" fill="${cols[i%5]}" stroke="#fff" stroke-width="6"/>`;
    svg+=`<g transform="translate(${cx} ${cy}) rotate(${a0+seg/2})"><circle r="62" fill="#fff"/><image href="${IMG[x.id]}" x="-58" y="-58" width="116" height="116" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${i})"/></g>`});
  svg+=`<circle r="${R-4}" fill="none" stroke="#fff" stroke-width="8"/></svg>`;
  const v=h(`<div class="wh"><div class="wheelbox"><div class="pointer"></div>${svg}<button class="hub">SPIN</button></div><div class="wres"><div class="prompt" style="text-align:left">Spin the wheel!</div></div></div>`);
  play.append(v);
  const wheel=v.querySelector('#wheel'),hub=v.querySelector('.hub'),res=v.querySelector('.wres');let rot=0,busy=false,spins=0,last=-1;
  hub.onclick=()=>{if(busy)return;busy=true;let t;do{t=Math.floor(Math.random()*N)}while(t===last);last=t;
    const jitter=(Math.random()-.5)*seg*.6;const want=((360-(t*seg+seg/2+jitter))%360+360)%360;
    let nr=rot-((rot%360)+360)%360+360*6+want;if(nr-rot<360*5)nr+=360;rot=nr;wheel.style.transform=`rotate(${rot}deg)`;wheel.dataset.target=t;
    res.innerHTML='<div class="prompt" style="text-align:left">...</div>';tone([[400,.08,0],[450,.08,.2],[500,.08,.4],[550,.08,.6]]);
    later(()=>{busy=false;const x=WH[t];spins++;
      res.innerHTML=`<div class="card"><img src="${IMG[x.id]}" alt="${x.w}"></div><button class="yb" style="border-radius:0;text-align:left">${sent(x).replace('. Who','.<br>Who')}</button><div class="prompt" style="text-align:left;color:${COLV[x.c]}">${x.act}</div>`;
      res.querySelector('.yb').onclick=()=>say(sent(x));ding();talk({img:x.id,...QA(x),mode:'ask'},()=>{addStar(1,res.querySelector('.card'));later(()=>say(x.act),300)});if(spins>=3)ctx.done()},4300)};
  later(()=>say('Spin the wheel!'),350);
}

/* full screen: standard API, then the Safari/iPad (webkit) one; if the browser or the page frame refuses, say how to do it by hand */
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function fullHelp(){const mac=/Mac|iPad|iPhone/.test(navigator.platform+navigator.userAgent);
  modal(`<h2>Full screen</h2><p>This browser did not allow full screen from the button.</p><ul><li>${mac?'Mac: press <b>Ctrl + Cmd + F</b> (or View → Enter Full Screen).':'Windows / smart board: press <b>F11</b>.'}</li><li>If the page is open inside another app (for example a chat app), open the file directly in Chrome or Edge, then press the button again.</li><li>iPhone does not support full screen for web pages; turn the phone sideways instead.</li></ul><div class="row"><button class="bigbtn" data-x>OK</button></div>`)}
function toggleFull(){const d=document,el=d.documentElement;
  try{if(fsEl()){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
    const req=el.requestFullscreen||el.webkitRequestFullscreen;if(!req){fullHelp();return}
    const r=req.call(el);if(r&&r.catch)r.catch(()=>fullHelp());
    setTimeout(()=>{if(!fsEl())fullHelp()},700)}catch(e){fullHelp()}}

  $('#bAgain').onclick=()=>{if(cur>=0)go(cur)};
  $('#bSound').onclick=()=>{S.sound=!S.sound;store();soundIcon();if(!S.sound)hush();if(cur===-1)go(-1)};
  $('#bTip').onclick=()=>{if(cur<0){modal(`<h2>How to use</h2><ul><li>Tap a game, or press "Start" to open the first unfinished game.</li><li>Top bar: menu, previous/next game, ${ONE_CLASS?'':'class, '}name picker, stars, play again, sound, tips, full screen.</li><li>The orange "Next" button moves to the next round; the dots jump to any round.</li><li><b>Speaking step:</b> after a correct answer the "Your turn!" screen opens. The question is spoken, the class answers out loud ("Help" says the answer). The star comes when you press "We said it!".</li>${ONE_CLASS?'':'<li><b>Class:</b> the purple label (e.g. J6A) changes the class. Each class keeps its own stars.</li>'}<li><b>Star reward:</b> in the name picker, press "Star reward", tap the children who are behaving well, then "Star draw!". Each child's stars are counted on their bubble; New round clears them. After a normal pick, "Give a star" rewards that child directly.</li><li><b>Name picker:</b> the person icon picks a name and says it; everyone gets one turn per round. The "Name" button on the "Your turn!" screen also picks a name.</li><li><b>Settings</b> (last tile): classroom/home, speaking step, teams, classes, names and words to practise.</li><li>If the device has no English voice, sentences appear on screen for an adult to read aloud.</li><li>Stars and settings are saved on this device.</li></ul><div class="row"><button class="bigbtn" data-x>OK</button></div>`);return}
    const A=ACTS[cur];modal(`<h2>${A.name}</h2>${S.mode==='home'?'<p><b>At home:</b> these tips are written for the classroom; play them with your child. On the "Your turn!" screen, press "I said it!" when your child says the sentence.</p>':''}<ul>${A.tip.map(t=>`<li>${t}</li>`).join('')}</ul><div class="row"><button class="bigbtn" data-x>OK</button></div>`)};
  $('#bFull').onclick=toggleFull;
  document.addEventListener('fullscreenchange',fit);document.addEventListener('webkitfullscreenchange',fit);
  fit();if(!ONE_CLASS&&S.mode==='class'&&!S.cls)classScreen();else go(-1)}
boot();
</script>
</body></html>
