<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="English Corner: interactive English games for young learners (Ready Steady 2A units) with a speaking step, magic name picker and star rewards."><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>[hidden]{display:none!important}</style><title>English Corner for Teachers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one fixed 16:9 classroom board (1600×900) scaled to fit any screen; slim tool bar on top, one big play area below.
   Deliberately single look: the pastel world of the "My Family" slides (cream + sky, yellow-framed boxes). */
:root{
  --cream:#FFF6D6; --sky:#E8F6FD; --ink:#2F2D52; --muted:#6B6890;
  --pink:#FF5F92; --blue:#3FB2E6; --purple:#8C64DB; --green:#4CC48E; --yellow:#FFD54A; --orange:#FF8A3D;
  --white:#FFFFFF; --red:#EF5350;
  --display:'Baloo 2','Fredoka','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#board{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;background:var(--cream);border-radius:28px;overflow:hidden;
  box-shadow:0 10px 40px rgba(47,45,82,.15);display:flex;flex-direction:column}
#board.alt{background:var(--sky)}
button{font-family:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:5px solid var(--orange);outline-offset:3px}
img{max-width:100%;-webkit-user-drag:none;user-select:none}
.dots-bg{position:absolute;border-radius:50%;pointer-events:none;opacity:.9}

/* top bar */
#bar{height:84px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;background:rgba(255,255,255,.75);border-bottom:4px solid var(--yellow);position:relative;z-index:5}
.tb{width:60px;height:60px;border-radius:18px;border:none;background:var(--white);box-shadow:0 3px 0 rgba(47,45,82,.15);display:grid;place-items:center;color:var(--ink)}
.tb svg{width:32px;height:32px}
.tb:active{transform:translateY(2px);box-shadow:none}
.tb.off{opacity:.45}
#title{flex:1;min-width:0;font:700 40px/1 var(--display);color:var(--pink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
#stars{display:flex;align-items:center;gap:6px;font:800 34px var(--display);color:var(--ink);background:var(--white);border-radius:30px;padding:4px 20px 4px 12px;box-shadow:0 3px 0 rgba(47,45,82,.15)}
#stars svg{width:38px;height:38px}
#stars.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.3)}}

#area{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
.play{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:20px 40px}
.foot{height:96px;flex:none;display:flex;align-items:center;justify-content:center;gap:14px;position:relative}
.rdots{display:flex;gap:10px}
.rdot{width:22px;height:22px;border-radius:50%;border:3px solid var(--purple);background:var(--white);padding:0}
.rdot.on{background:var(--purple)}
.rdot.done{background:var(--green);border-color:var(--green)}
.nextbtn{position:absolute;right:34px;bottom:16px}
.bigbtn{border:none;border-radius:40px;padding:14px 34px;font:700 34px var(--display);color:var(--white);background:var(--orange);box-shadow:0 6px 0 #D96A24;display:inline-flex;align-items:center;gap:10px}
.bigbtn svg{width:32px;height:32px}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #D96A24}
.bigbtn.pinkb{background:var(--pink);box-shadow:0 6px 0 #D9467A}
.bigbtn.blueb{background:var(--blue);box-shadow:0 6px 0 #2A8FBD}
.bigbtn.greenb{background:var(--green);box-shadow:0 6px 0 #33A072}
.bigbtn.purpleb{background:var(--purple);box-shadow:0 6px 0 #6E49B8}
.prompt{font:700 46px/1.1 var(--display);color:var(--ink);text-align:center;margin:0}
.yb{background:var(--white);border:6px solid var(--yellow);padding:18px 26px;font:800 40px/1.25 var(--body);color:var(--ink)}
.card{background:var(--white);border-radius:30px;overflow:hidden;box-shadow:0 6px 0 rgba(47,45,82,.12);border:none;padding:0}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.spk{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--blue);color:var(--white);flex:none}
.spk svg{width:30px;height:30px}
.tr{font:800 30px var(--body);color:var(--purple)}
.hideTr .tr{visibility:hidden}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.wiggle{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.good{outline:10px solid var(--green);outline-offset:-10px}
.bad{opacity:.35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* menu */
.menu{flex:1;display:flex;flex-direction:column;padding:26px 46px 20px;gap:18px;min-height:0}
.mhead{display:flex;align-items:center;gap:24px}
.mhead h1{margin:0;font:800 84px/1 var(--display);color:var(--pink)}
.mhead p{margin:0;font:800 30px var(--body);color:var(--ink)}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:20px;min-height:0}
.tile{position:relative;border:none;border-radius:26px;background:var(--white);box-shadow:0 6px 0 rgba(47,45,82,.12);display:flex;flex-direction:column;overflow:hidden;padding:0;text-align:left}
.tile .th{flex:1;min-height:0;background-size:cover;background-position:center}
.tile .tl{padding:10px 16px 12px;font:700 30px/1.05 var(--display);color:var(--ink);display:flex;gap:10px;align-items:center}
.tile .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--white);font:800 22px var(--body)}
.tile .ck{position:absolute;top:10px;right:10px;width:50px;height:50px;border-radius:50%;background:var(--green);color:var(--white);display:grid;place-items:center}
.tile .ck svg{width:30px;height:30px}
.mfoot{display:flex;align-items:center;gap:16px}
.mfoot .sp{flex:1}
.pill{border:3px solid var(--purple);background:var(--white);color:var(--purple);border-radius:30px;padding:8px 20px;font:800 24px var(--body)}
.pill.on{background:var(--purple);color:var(--white)}

/* modal */
#modal{position:absolute;inset:0;background:rgba(47,45,82,.45);display:flex;align-items:center;justify-content:center;z-index:50}
#modal .box{background:var(--white);border-radius:30px;padding:34px 40px;max-width:1000px;border:6px solid var(--yellow)}
#modal h2{margin:0 0 12px;font:800 40px var(--display);color:var(--purple)}
#modal p,#modal li{font:700 28px/1.45 var(--body);color:var(--ink);margin:0 0 8px}
#modal ul{margin:0 0 16px;padding-left:30px}
#modal .row{display:flex;gap:14px;justify-content:flex-end;margin-top:18px}

/* celebration */
#burst{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.bstar{position:absolute;width:60px;height:60px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.4);opacity:0}}
.donebox{display:flex;flex-direction:column;align-items:center;gap:22px}
.donebox .big{font:800 90px/1 var(--display);color:var(--pink)}

/* look & listen */
.ll{display:flex;align-items:center;gap:60px;width:100%;height:100%}
.ll .pic{width:560px;height:574px;flex:none;cursor:pointer}
.ll .txt{flex:1;display:flex;flex-direction:column;gap:22px;align-items:flex-start;min-width:0}
.ll .word{font:800 120px/1 var(--display);border:none;background:none;padding:0;display:flex;align-items:center;gap:20px}
.ll .yb{display:flex;align-items:center;gap:18px;border-radius:0;cursor:pointer;text-align:left}

/* grids of choices */
.choices{display:flex;gap:34px;justify-content:center}
.choice{width:320px;height:328px}
.choice.sm{width:250px;height:256px}

/* sort */
.sort{display:flex;flex-direction:column;width:100%;height:100%;gap:18px}
.pool{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;min-height:180px}
.it{width:160px;height:164px;touch-action:none;cursor:grab;position:relative;z-index:2}
.it.sel{outline:8px solid var(--orange);outline-offset:-8px}
.it.drag{z-index:30;cursor:grabbing;box-shadow:0 18px 30px rgba(47,45,82,.3)}
.bins{flex:1;display:flex;gap:30px;min-height:0}
.bin{flex:1;border-radius:30px;border:6px dashed;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px;background:rgba(255,255,255,.6)}
.bin h3{margin:0;font:800 50px/1 var(--display)}
.bin .got{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bin .got .card{width:110px;height:113px}
.bin.hover{background:var(--white)}

/* fill */
.fill{display:flex;gap:56px;align-items:center;width:100%}
.fill .pic{width:470px;height:482px;flex:none}
.fill .right{flex:1;display:flex;flex-direction:column;gap:30px}
.blank{display:inline-block;min-width:240px;border-bottom:6px solid var(--ink);text-align:center;color:var(--green)}
.wbtns{display:flex;gap:18px;flex-wrap:wrap}
.wbtn{border:none;border-radius:24px;background:var(--white);padding:16px 30px;font:800 40px var(--body);box-shadow:0 5px 0 rgba(47,45,82,.15);color:var(--ink)}
.wbtn.good{outline-offset:2px;outline-width:6px;background:#E3F8EE}

.ask{border:none;background:var(--white);border:6px solid var(--yellow);padding:14px 30px 14px 16px;display:flex;align-items:center;gap:18px;font:800 52px var(--display);color:var(--ink)}
.ask .spk{width:72px;height:72px;background:var(--purple)}
.ask .spk svg{width:42px;height:42px}
.sbtns{display:flex;gap:40px}
.sbtn{width:160px;height:160px;border-radius:50%;border:none;background:var(--c);box-shadow:0 8px 0 var(--s);color:var(--white);display:grid;place-items:center;transition:transform .15s}
.sbtn svg{width:96px;height:96px}
.sbtn:active{transform:translateY(5px);box-shadow:0 3px 0 var(--s)}
.sbtn.playing{animation:pulse .6s infinite alternate}
.sbtn.good{outline:12px solid var(--green);outline-offset:6px}
.sbtn{position:relative}
.sbtn .tick{position:absolute;top:-6px;right:-6px;width:56px;height:56px;border-radius:50%;background:var(--white);color:var(--green);display:none;place-items:center;box-shadow:0 3px 0 rgba(47,45,82,.15)}
.sbtn .tick svg{width:38px;height:38px}
.sbtn.heard .tick{display:grid}
.scol{display:flex;flex-direction:column;align-items:center;gap:20px}
.scol.bad{opacity:.35}
.pick{width:120px;height:120px;border-radius:30px;border:6px solid var(--c);background:var(--white);color:var(--c);display:grid;place-items:center;box-shadow:0 6px 0 var(--s)}
.pick svg{width:72px;height:72px}
.pick:disabled{opacity:.25;box-shadow:none;cursor:default}
.ready .pick:not(:disabled){animation:pulse .7s 3 alternate}
.pick.good,.pick.good:disabled{opacity:1;background:var(--green);border-color:var(--green);color:var(--white);box-shadow:0 6px 0 #33A072}
.hint{font:800 40px var(--display);color:var(--purple)}
@keyframes pulse{to{transform:scale(1.1)}}
.ans{font:800 44px/1.3 var(--body);text-align:center;color:var(--ink)}
/* class chip + class screen */
.clschip{border:none;border-radius:30px;background:var(--purple);color:var(--white);font:800 30px var(--display);padding:6px 22px;height:60px;box-shadow:0 3px 0 #6E49B8;display:flex;align-items:center;gap:8px}
.clschip:active{transform:translateY(2px);box-shadow:none}
.clsscreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.clsscreen h1{margin:0;font:800 96px/1 var(--display);color:var(--pink)}
.clsrow{display:flex;gap:50px;flex-wrap:wrap;justify-content:center}
.clsbtn{width:400px;height:300px;border:none;border-radius:40px;color:var(--white);font:800 120px/1 var(--display);box-shadow:0 12px 0 var(--s);background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.clsbtn small{font:800 26px var(--body);opacity:.9}
.clsbtn:active{transform:translateY(8px);box-shadow:0 4px 0 var(--s)}
.homelink{border:none;background:none;font:800 28px var(--body);color:var(--muted);text-decoration:underline}
/* magic name picker */
.mp{position:absolute;inset:0;z-index:48;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,#3B2A78 0%,#1E1646 55%,#110C2A 100%);animation:gin .25s}
.mpc{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none}
.mphead{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;z-index:8}
.mptitle{display:flex;align-items:center;gap:14px;font:800 52px var(--display);color:#FFE07A}
.mptitle svg{width:52px;height:52px}
.mpx{width:72px;height:72px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.mpx svg{width:40px;height:40px}
.orbit{position:absolute;inset:0;pointer-events:none}
.nb{position:absolute;left:0;top:0;pointer-events:auto;border:none;border-radius:40px;padding:10px 26px;font-family:var(--display);font-weight:800;color:#fff;background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 22px color-mix(in srgb,var(--c) 70%,transparent);white-space:nowrap;display:flex;align-items:center;gap:8px;will-change:transform}
.nb.done{filter:saturate(.35) brightness(.85)}
.nb.abs{background:#5E5A78;color:#B9B5D6;text-decoration:line-through;box-shadow:none}
.nb .ok{color:#FFE07A}
.nb .zz{font-size:.6em;opacity:.8}
.nb.cur{outline:6px solid #FFE07A;filter:none}
.hat{position:absolute;left:609px;top:378px;width:382px;height:300px;border:none;background:none;padding:0;z-index:5;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.hat.shake{animation:hatshake .65s}
@keyframes hatshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg) translateY(-6px)}35%{transform:rotate(6deg)}55%{transform:rotate(-5deg) translateY(-4px)}75%{transform:rotate(4deg)}}
.winner{position:absolute;left:800px;top:250px;z-index:9;width:0;height:0}
.winner .rays{position:absolute;left:-330px;top:-330px;width:660px;height:660px;border-radius:50%;background:repeating-conic-gradient(rgba(255,224,122,.55) 0deg 10deg,rgba(255,224,122,0) 10deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wcard{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:#fff;border:8px solid #FFD54A;border-radius:40px;padding:26px 40px 26px 56px;display:flex;align-items:center;gap:26px;box-shadow:0 0 60px rgba(255,213,74,.8),0 14px 0 rgba(0,0,0,.2)}
.wname{font:800 120px/1 var(--display);color:var(--pink);white-space:nowrap}
.wsay{width:84px;height:84px;border-radius:50%;border:none;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.wsay svg{width:48px;height:48px}
.winner.show .wcard{animation:rise .9s cubic-bezier(.2,1.4,.4,1)}
.winner.show .rays{animation:spin 9s linear infinite,fadein .6s}
@keyframes rise{0%{transform:translate(-50%,180px) scale(.1);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes fadein{from{opacity:0}}
.mpbar{position:absolute;left:0;right:0;bottom:58px;display:flex;justify-content:center;gap:20px;z-index:8}
.bigbtn.magic{background:linear-gradient(90deg,#FF5F92,#8C64DB);box-shadow:0 6px 0 #5B3FA8;font-size:40px;padding:14px 40px}
.mpinfo{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:700 22px var(--body);color:#C9C3EE;z-index:8}
@media (prefers-reduced-motion:reduce){.winner .rays{animation:none}}
/* star reward mode */
.mp.gold{background:radial-gradient(ellipse at 50% 70%,#7A4A12 0%,#3E2266 55%,#1B1035 100%)}
.nb.good{outline:6px solid #FFD54A;box-shadow:0 0 30px #FFD54A,0 6px 0 rgba(0,0,0,.25);filter:none}
.nb .rc{background:#FFD54A;color:#5B3FA8;border-radius:16px;padding:0 10px;font-size:.72em;margin-left:4px}
.wcard.gold{background:linear-gradient(#FFFBEA,#FFE9A3);border-color:#F2B51C}
.wcard .wsub{display:none;font:800 44px var(--display);color:#E59A00;white-space:nowrap}
.wcard.gold .wsub{display:block}
.wtext{display:flex;flex-direction:column;align-items:center}
.bigbtn.starb{background:linear-gradient(90deg,#F2B51C,#FF8A3D);box-shadow:0 6px 0 #B9770E}
/* name picker */
.picker{position:absolute;inset:0;z-index:48;background:rgba(47,45,82,.6);display:flex;align-items:center;justify-content:center;animation:gin .2s}
.pbox2{background:var(--cream);border:8px solid var(--yellow);border-radius:40px;width:1300px;padding:30px 40px;display:flex;flex-direction:column;gap:22px;align-items:center}
.phead{display:flex;width:100%;align-items:center;gap:16px}
.phead h2{margin:0;flex:1;font:800 54px var(--display);color:var(--purple)}
.pname{width:100%;height:220px;border-radius:30px;background:var(--white);border:6px solid var(--purple);display:grid;place-items:center;font:800 130px/1 var(--display);color:var(--ink);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 20px}
.pname.roll{color:var(--muted)}
.pname.land{animation:pop .5s;color:var(--pink)}
.prow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pchips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:210px;overflow:auto;width:100%}
.pchip{border:3px solid var(--purple);background:var(--white);color:var(--ink);border-radius:24px;padding:6px 16px;font:800 24px var(--body)}
.pchip.done{opacity:.4}
.pchip.abs{text-decoration:line-through;border-color:var(--red);color:var(--red);opacity:.7}
.pchip.cur{background:var(--pink);border-color:var(--pink);color:var(--white);opacity:1}
.pinfo{font:700 22px/1.35 var(--body);color:var(--muted);text-align:center}
.gname{font:800 60px var(--display);color:var(--purple)}
.namesbox{width:100%;height:220px;font:700 24px/1.4 var(--body);border:3px solid var(--purple);border-radius:16px;padding:10px 14px;resize:vertical;color:var(--ink);background:var(--white)}
.clsin{font:800 24px var(--body);border:3px solid var(--purple);border-radius:14px;padding:6px 12px;width:420px;color:var(--ink);background:var(--white)}
/* topic screen + body parts */
.tpscreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.tpscreen h1{margin:0;font:800 84px/1 var(--display);color:var(--pink)}
.tprow{display:flex;gap:60px}
.tpbtn{width:560px;height:560px;border:none;border-radius:44px;background:var(--c);box-shadow:0 12px 0 var(--s);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:24px;font-family:var(--display)}
.tpbtn:active{transform:translateY(8px);box-shadow:0 4px 0 var(--s)}
.tpbtn b{font-size:64px;line-height:1}.tpbtn small{font:800 28px var(--body);opacity:.92}
.tpimg{flex:1;width:100%;border-radius:30px;overflow:hidden;background:#fff;display:flex;align-items:flex-end;justify-content:center}
.tpimg img{width:100%;height:100%;object-fit:cover}
.tpb{background:var(--sky);gap:0}.tpb svg{height:96%;width:auto}
.pp{display:block;overflow:hidden}
.pp .pt{cursor:pointer}
.pp .hl{filter:drop-shadow(0 0 5px #FFD54A) drop-shadow(0 0 12px #FFB300);animation:hlp .9s ease-in-out infinite alternate}
.pp .ring{fill:none;stroke:#FFB300;stroke-width:6;stroke-dasharray:14 9;animation:hlp .9s ease-in-out infinite alternate;pointer-events:none}
@keyframes hlp{from{opacity:.75}to{opacity:1}}
.bfig{flex:none;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:var(--white);border-radius:30px;box-shadow:0 6px 0 rgba(47,45,82,.12)}
.bfig.big{width:470px;height:640px;padding:16px}.bfig.big svg{height:100%;width:auto}
.bfig.mid{width:330px;height:470px;padding:10px;box-shadow:none;background:transparent}.bfig.mid svg{height:100%;width:auto}
.bfig.head{width:520px;height:470px;align-items:center}.bfig.head svg{width:92%;height:auto}
.bh{display:flex;gap:60px;align-items:center}.bh .bfig{width:460px;height:660px;padding:14px}.bh .bfig svg{height:100%;width:auto}

  if(top){const c=hex(RAMP.top[top]);jobs.push([2,[c.map(v=>v*.42),c.map(v=>v+(255-v)*.5)],st.top])}
  jobs.forEach(([ch,ramp,[lo,hi]])=>{const a=Array.isArray(ramp[0])?ramp[0]:hex(ramp[0]),b=Array.isArray(ramp[1])?ramp[1]:hex(ramp[1]),span=Math.max(20,hi-lo);

/* ---------- A3 Magic Paint ---------- */
/* Magic Paint has two levels.
   Easy: the child asks the question, taps the grey hair/eyes with the brush, the hidden colour appears.
   Medium: the class asks the question, the child presses the microphone and says "She has got red hair!";
   the colour the child SAYS spreads over the hair. If speech recognition is not available (or does not
   understand twice), big colour buttons appear so the turn can still finish. */
const SRec=window.SpeechRecognition||window.webkitSpeechRecognition;
const PAINT_ROLES=['mum','dad','sister','brother','aunt','uncle'];
/* forgiving colour matching: young learners' pronunciation is often recognised as a similar word */
const SOUNDS={red:['red','read','rad','rid','bread','wed','rate','ret'],blue:['blue','blew','glue','boo','blu','flu'],green:['green','grin','clean','queen','grain','greene'],
  brown:['brown','bran','round','crown','brawn','browne','brow'],black:['black','block','blank','plaque','back','blacks','flack'],yellow:['yellow','hello','jello','yello','fellow','mellow']};
function heardColour(alts,allowed){for(const a of alts){const w=(' '+a.toLowerCase().replace(/[^a-z ]/g,' ')+' ');
  for(const c of allowed){if(SOUNDS[c].some(s=>w.includes(' '+s+' ')))return c}}return null}
function bPaint(area,ctx){
  if(!S.paintLevel)S.paintLevel='easy';
  const play=h('<div class="play"></div>');area.append(play);
  const lv=h(`<div class="lvl"><button class="lvb" data-l="easy">${'<svg viewBox="0 0 60 60" width="44" height="44"><path d="M8 52 L30 30" stroke="#7A4A25" stroke-width="7" stroke-linecap="round"/><path d="M30 30 Q44 10 54 6 Q50 20 34 34Z" fill="#FF5F92"/></svg>'}<span>Easy</span></button><button class="lvb" data-l="medium">${micSVG(44)}<span>Medium</span></button></div>`);
  play.append(lv);
  const box=h('<div class="lvbox"></div>');play.append(box);
  const paint=()=>{lv.querySelectorAll('.lvb').forEach(b=>b.classList.toggle('on',b.dataset.l===S.paintLevel));box.innerHTML='';clearTimers();hush();
    (S.paintLevel==='medium'?paintMedium:paintEasy)(box,ctx)};
  lv.querySelectorAll('.lvb').forEach(b=>b.onclick=()=>{S.paintLevel=b.dataset.l;store();paint()});
  paint()}
function micSVG(s){return `<svg viewBox="0 0 60 60" width="${s}" height="${s}"><rect x="21" y="6" width="18" height="32" rx="9" fill="currentColor"/><path d="M13 28a17 17 0 0 0 34 0M30 45v9M20 54h20" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`}
function paintEasy(play,ctx){
  const v=h(`<div class="ll"><div class="bfig big mp2"></div><div class="txt mpside">
    <div class="turn" hidden></div>
    <div class="steps">
      <div class="step s1"><span class="sn">1</span><button class="bub l mq"><span class="who" style="background:var(--pink)">${ic('mouth')}</span><span class="mqt"></span></button></div>
      <div class="step s2"><span class="sn">2</span><div class="brushhint">${ic('hand')}<svg viewBox="0 0 60 60" width="60" height="60"><path d="M8 52 L30 30" stroke="#7A4A25" stroke-width="7" stroke-linecap="round"/><path d="M30 30 Q44 10 54 6 Q50 20 34 34Z" fill="#FF5F92"/></svg></div></div>
      <div class="step s3"><span class="sn">3</span><button class="bub r ma"><span class="who" style="background:var(--blue)">${ic('mouth')}</span><span class="mat">?</span></button><button class="bigbtn greenb mok">${ic('check')}</button></div>
    </div>
    <button class="bigbtn mnext">${ic('pick')} Next child ${ic('right')}</button>
    <div class="tr" style="color:var(--muted)">1 The child ASKS the class the question (tap the bubble to hear it). 2 The child taps the grey hair/eyes with the magic brush. 3 The class answers; press ✓. Then the eyes.</div></div></div>`);
  play.append(v);
  const fig=v.querySelector('.mp2'),turn=v.querySelector('.turn'),mq=v.querySelector('.mqt'),ma=v.querySelector('.mat');
  let role,look,stage,phase='hair',queue=[];
  const P=()=>pr(look),pl=()=>P().toLowerCase();
  const qOf=()=>phase==='hair'?`What colour hair has ${pl()} got?`:`What colour eyes has ${pl()} got?`;
  const aOf=()=>phase==='hair'?`${P()} has got ${look.hc} hair.`:`${P()} has got ${look.ec} eyes.`;
  const draw=()=>setPhoto(fig,role,{hc:stage.hair?look.hc:'mystery',ec:stage.eyes?look.ec:'mystery',hl:stage.step===2?phase:null,head:phase==='eyes'&&stage.step<4});
  const setStep=n=>{stage.step=n;v.querySelectorAll('.step').forEach((s,i)=>{s.classList.toggle('on',i+1===n);s.classList.toggle('done',i+1<n)});draw()};
  function newTurn(){if(!queue.length)queue=shuffle(PAINT_ROLES);role=queue.shift();look=PEOPLE[role];stage={hair:false,eyes:false,step:1};phase='hair';mq.textContent=qOf();ma.textContent='?';setStep(1)}
  v.querySelector('.mq').onclick=()=>{say(qOf());if(stage.step===1)later(()=>setStep(2),1600)};
  fig.addEventListener('click',e=>{if(stage.step!==2)return;const part=partAt(fig.querySelector('svg'),e,role);if(!part)return;
    if(part!==phase){buzz();return}
    stage[phase]=true;fig.classList.remove('magic');void fig.offsetWidth;fig.classList.add('magic');burst(fig);tone([[523,.08,0],[784,.08,.08],[1046,.2,.16]]);setStep(3);ma.textContent='?'});
  v.querySelector('.ma').onclick=()=>{if(stage.step===3){ma.textContent=aOf();say(aOf())}};
  v.querySelector('.mok').onclick=()=>{if(stage.step!==3)return;ma.textContent=aOf();ding();
    if(phase==='hair'){phase='eyes';mq.textContent=qOf();ma.textContent='?';setStep(1)}
    else{addStar(2,fig);setStep(4);later(()=>say('Well done!'),300);ctx.done()}};
  v.querySelector('.mnext').onclick=()=>{newTurn();nextTurnName(turn)};
  newTurn();later(()=>say(qOf()),400);
}
function paintMedium(play,ctx){
  const v=h(`<div class="ll"><div class="bfig big mp2"></div><div class="txt mpside">
    <div class="turn" hidden></div>
    <button class="bub l mq"><span class="who" style="background:var(--pink)">${ic('mouth')}</span><span class="mqt"></span></button>
    <div class="microw"><button class="mic" aria-label="Press and speak">${micSVG(96)}</button><div class="said"></div></div>
    <div class="swatches" hidden></div>
    <button class="bigbtn mnext">${ic('pick')} Next child ${ic('right')}</button>
    <div class="tr" style="color:var(--muted)">The class asks the question (tap the pink bubble to hear it). The child presses the microphone and says the answer: "She has got red hair." The colour the child says appears. If the microphone does not work, the child says it and taps the colour.</div></div></div>`);
  play.append(v);
  const fig=v.querySelector('.mp2'),turn=v.querySelector('.turn'),mq=v.querySelector('.mqt'),mic=v.querySelector('.mic'),said=v.querySelector('.said'),sw=v.querySelector('.swatches');
  let role,look,phase,col={},fails=0,rec=null,busy=false,queue=[];
  const P=()=>pr(look),pl=()=>P().toLowerCase();
  const allowed=()=>phase==='hair'?['brown','black','yellow','red']:['blue','brown','green'];
  const qOf=()=>phase==='hair'?`What colour hair has ${pl()} got?`:`What colour eyes has ${pl()} got?`;
  const aOf=c=>phase==='hair'?`${P()} has got ${c} hair.`:`${P()} has got ${c} eyes.`;
  const draw=()=>setPhoto(fig,role,{hc:col.hair||'mystery',ec:col.eyes||'mystery',hl:phase&&!col[phase]?phase:null,head:phase==='eyes'});
  function showSwatches(){sw.hidden=false;sw.innerHTML='';allowed().forEach(c=>{const b=h(`<button class="swb" aria-label="${c}" style="background:${phase==='hair'?HAIRC[c]:EYEC[c]}"></button>`);b.onclick=()=>apply(c);sw.append(b)})}
  function apply(c){col[phase]=c;sw.hidden=true;said.textContent='';fig.classList.remove('magic');void fig.offsetWidth;fig.classList.add('magic');draw();burst(fig);
    tone([[523,.08,0],[659,.08,.08],[784,.08,.16],[1046,.25,.24]]);later(()=>say(`Yes! ${aOf(c)}`),500);
    later(()=>{if(phase==='hair'){phase='eyes';fails=0;mq.textContent=qOf();draw();later(()=>say(qOf()),300)}else{phase=null;draw();addStar(2,fig);later(()=>say('Well done!'),300);ctx.done()}},2600)}
  function listen(){if(busy||!phase)return;
    if(!SRec){said.textContent='';showSwatches();return}
    try{hush();rec=new SRec();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5}catch(e){showSwatches();return}
    busy=true;mic.classList.add('on');said.textContent='…';
    let wd=later(()=>{if(busy){try{rec.abort()}catch(_){}stop();said.textContent='';fails++;say('Try again!');if(fails>=2)showSwatches()}},8000);const stop=()=>{busy=false;mic.classList.remove('on')};
    rec.onresult=e=>{const alts=[...e.results[0]].map(r=>r.transcript);stop();const c=heardColour(alts,allowed());said.textContent=alts[0]||'';
      if(c)apply(c);else{fails++;buzz();say('Try again!');if(fails>=2)showSwatches()}};
    rec.onerror=e=>{stop();said.textContent='';if(e.error==='no-speech'){fails++;say('Try again!');if(fails>=2)showSwatches()}else showSwatches()};
    rec.onend=()=>{if(busy){stop();if(said.textContent==='…'){said.textContent='';fails++;if(fails>=2)showSwatches()}}};
    try{rec.start()}catch(e){stop();showSwatches()}}
  mic.onclick=listen;
  v.querySelector('.mq').onclick=()=>{if(phase)say(qOf())};
  function newTurn(){if(!queue.length)queue=shuffle(PAINT_ROLES);role=queue.shift();look=PEOPLE[role];col={};phase='hair';fails=0;sw.hidden=true;said.textContent='';mq.textContent=qOf();draw()}
  v.querySelector('.mnext').onclick=()=>{newTurn();nextTurnName(turn);later(()=>say(qOf()),namesOn()?2000:300)};
  newTurn();later(()=>say(qOf()),400);
}

function bDesign(area,ctx){

  const eyeIc=c=>`<svg viewBox="0 0 60 60"><ellipse cx="30" cy="30" rx="24" ry="17" fill="#fff" stroke="#2F2D52" stroke-width="3"/><circle cx="30" cy="30" r="12" fill="${EYEC[c]}"/><circle cx="30" cy="30" r="5" fill="#1d1a2e"/><circle cx="34" cy="26" r="3" fill="#fff"/></svg>`;

    {k:'height',col:0,opts:[['tall',sizeIc('tall')],['short',sizeIc('short')]],say:v=>`${P()} is ${v}.`},
    {k:'acc',col:0,opts:Object.keys(ACC).map(a=>[a,a==='none'?'<span class="dot" style="background:#fff;border:3px dashed #bbb"></span>':accIcon(ACC[a])]),say:()=>'Wow!'},
    {k:'hc',col:1,opts:['brown','black','yellow','red','grey'].map(c=>[c,hairIc(c)]),say:v=>`${P()} has got ${v} hair.`},

/* round engine: items -> render(item, api) */
function rounds(area,ctx,items,render,opts={}){
  const play=h('<div class="play"></div>'),foot=h('<div class="foot"><div class="rdots"></div></div>');
  const next=h(`<button class="bigbtn nextbtn">Next ${ic('right')}</button>`);foot.append(next);area.append(play,foot);
  const dots=foot.querySelector('.rdots');const solved=new Set();let k=0;
  items.forEach((_,j)=>{const d=h(`<button class="rdot" aria-label="Round ${j+1}"></button>`);d.onclick=()=>show(j);dots.append(d)});
  function paint(){[...dots.children].forEach((d,j)=>{d.className='rdot'+(solved.has(j)?' done':'')+(j===k?' on':'')})}
  function show(j){clearTimers();hush();k=j;play.innerHTML='';paint();
    render(items[j],{play,solve(el,n=1){if(!solved.has(k)){solved.add(k);addStar(n,el);paint();if(solved.size===items.length)ctx.done()}else burst(el)},index:j})}
  next.onclick=()=>{if(k<items.length-1)show(k+1);else finish()};
  function finish(){clearTimers();ctx.done();play.innerHTML='';dots.innerHTML='';next.hidden=true;
    const b=h(`<div class="donebox"><div class="big">Well done!</div><div class="prompt">${ic('star').replace('<svg','<svg width="90" height="90"')}</div><div style="display:flex;gap:20px"><button class="bigbtn blueb">${ic('again')} Again</button><button class="bigbtn">Next game ${ic('right')}</button></div></div>`);
    play.append(b);b.querySelector('.blueb').onclick=()=>go(cur);b.querySelector('.bigbtn:not(.blueb)').onclick=ctx.next;say('Well done!');tone([[523,.15,0],[659,.15,.15],[784,.15,.3],[1046,.4,.45]])}
  show(0);
}

/* ---------- talk gate ----------
   After a correct answer the star waits until the class SAYS the language.
   mode 'ask': the app asks (Who is she?) and children answer (She is my mum.)
   mode 'repeat': the app models the line and children repeat it.
   The teacher confirms with "We said it!" (no microphone needed). Can be switched off in the menu. */
const QA=x=>x.g==='both'?{q:'Who is she? Who is he?',a:'She is my cousin. He is my cousin.'}:{q:x.g==='he'?'Who is he?':'Who is she?',a:`${x.g==='he'?'He':'She'} is my ${x.w}.`};
function talk(o,done){
  if(!S.talk){later(()=>say(o.q?`${o.q} ${o.a}`:o.a),300);if(done)done();return}
  const ask=o.mode==='ask';
  const g=h(`<div class="gate" role="dialog" aria-label="Your turn"><div class="gbox">
    ${o.svg?`<div class="card gimg gsvg">${o.svg}</div>`:o.img?`<div class="card gimg"><img src="${IMG[o.img]}" alt=""></div>`:''}
    <div class="gcol"><div class="gt">${ic('mouth')}<span class="gtt">Your turn!</span>${teamsOn()?`<span class="gteam" style="background:${S.team?'var(--blue)':'var(--pink)'}">${S.team?'Blue':'Pink'} team</span>`:''}</div>
      <button class="gq"><span class="spk">${ic('son')}</span><span>${ask?o.q:o.a}</span></button>
      <div class="gtr">${S.mode==='home'?(ask?`Your child answers out loud: <b>${o.a}</b><br>Stuck? "Help" says the answer; say it together.`:'Listen first, then your child says it out loud.'):(ask?`The class answers out loud: <b>${o.a}</b><br>Stuck? "Help" says the answer.`:'Listen first, then everyone says it out loud.')}</div>
      <div class="grow">${ask?`<button class="bigbtn blueb ghelp">${ic('ear')} Help</button>`:`<button class="bigbtn blueb gagain">${ic('again')} Again</button>`}
      ${namesOn()?`<button class="bigbtn purpleb gpick">${ic('pick')} Name</button>`:''}
      <button class="bigbtn greenb gok">${ic('star')} ${S.mode==='home'?'I said it!':'We said it!'}</button></div></div></div></div>`);
  const play=()=>ask?say(o.q,1.25):say(o.a);
  g.querySelector('.gq').onclick=play;
  const hb=g.querySelector('.ghelp');if(hb)hb.onclick=()=>{say(o.a,.95);const q=g.querySelector('.gq');q.classList.add('ans');q.lastElementChild.textContent=o.a};
  const ab=g.querySelector('.gagain');if(ab)ab.onclick=play;

  g.querySelector('.gok').onclick=()=>{g.remove();tone([[784,.12,0],[988,.12,.1],[1318,.25,.2]]);if(done)done()};
  $('#area').append(g);later(play,350);
}

function pickName(){const all=clsNames(),abs=absentNow();let done=S.picked[S.cls]||[];
  let pool=all.filter(n=>!abs.includes(n)&&!done.includes(n));let fresh=false;
  if(!pool.length){done=[];pool=all.filter(n=>!abs.includes(n));fresh=true}
  if(!pool.length)return{name:null,fresh};
  const n=pool[Math.floor(Math.random()*pool.length)];S.picked[S.cls]=[...done,n];store();return{name:n,fresh}}

function picker(){if(S.mode!=='class'||!S.cls)return;

/* class-lists file: {"type":"class-lists","classes":{"J6A":["Name",…],…}} */
function importClassLists(text){let d;try{d=JSON.parse(text)}catch(e){return 0}
  if(!d||d.type!=='class-lists'||!d.classes||typeof d.classes!=='object')return 0;
  const keys=Object.keys(d.classes).map(k=>String(k).trim().toUpperCase().slice(0,12)).filter(Boolean).slice(0,12);if(!keys.length)return 0;
  Object.keys(d.classes).forEach(k=>{const K=String(k).trim().toUpperCase().slice(0,12);const list=Array.isArray(d.classes[k])?[...new Set(d.classes[k].map(s=>String(s).trim()).filter(Boolean))].slice(0,40):[];S.names[K]=list});
  saveCls();S.multi=true;S.classes=keys;if(ONE_BUILD)ONE_CLASS=false;S.mode='class';S.cls=null;try{sessionStorage.removeItem(CLS_SESSION)}catch(e){}store();paintBar();return keys.length}

/* ---------- 1 hello ---------- */
function actHello(area,ctx){
  const p=h(`<div class="play" style="flex-direction:column;gap:22px"><button class="card" style="width:1180px;height:664px;cursor:pointer" aria-label="My family"><img src="${IMG.cover}" alt="A big happy family"></button>
   <div style="display:flex;gap:20px;align-items:center"><button class="yb" style="display:flex;gap:16px;align-items:center;border-radius:0"><span class="spk">${ic('son')}</span>This is my family!</button><button class="bigbtn">Let's go! ${ic('right')}</button></div></div>`);
  const pic=p.querySelector('.card');pic.onclick=()=>{pic.classList.remove('wiggle');void pic.offsetWidth;pic.classList.add('wiggle');say('This is my family. Meet everyone!')};
  p.querySelector('.yb').onclick=()=>{say('This is my family!');ctx.done()};
  p.querySelector('.bigbtn').onclick=()=>{ctx.done();ctx.next()};
  area.append(p);later(()=>say('Hello! This is my family. Meet everyone!'),400);
}

/* ---------- 2 look & listen ---------- */
function actLook(area,ctx){
  rounds(area,ctx,SEL(),(x,api)=>{
    const flip=api.index%2===1; // alternate sides like the slides
    const v=h(`<div class="ll" style="flex-direction:${flip?'row-reverse':'row'}"><button class="card pic" aria-label="${x.w}"><img src="${IMG[x.id]}" alt="${x.w}"></button>
      <div class="txt"><button class="word" style="color:${COLV[x.c]}">${cap(x.w)}</button>
      <button class="yb">${ic('son').replace('<svg','<span class="spk"><svg').replace('</svg>','</svg></span>')}<span>${sent(x).replace('. Who','.<br>Who')}</span></button>
      <button class="bigbtn pinkb yt">${ic('mouth')} Your turn!</button></div></div>`);
    const pic=v.querySelector('.pic');
    pic.onclick=()=>{pic.classList.remove('wiggle');void pic.offsetWidth;pic.classList.add('wiggle');say(x.w)};
    v.querySelector('.word').onclick=()=>say(x.w);
    v.querySelector('.yb').onclick=()=>say(sent(x));
    v.querySelector('.yt').onclick=e=>{const b=e.currentTarget;talk({img:x.id,a:sent(x),mode:'repeat'},()=>api.solve(b))};
    api.play.append(v);later(()=>say(x.w),350);
  });
}

/* ---------- 3 listen & touch ---------- */
function actTouch(area,ctx){
  const items=targets(SEL(),8).map(t=>({t,opts:shuffle([t,...pick(W.filter(o=>o!==t),3)])}));
  rounds(area,ctx,items,(it,api)=>{
    const ask=`Touch the ${it.t.w}!`;
    const v=h(`<div style="display:flex;flex-direction:column;gap:30px;align-items:center"><button class="yb" style="display:flex;gap:16px;align-items:center;border-radius:0"><span class="spk">${ic('son')}</span>${ask}</button><div class="choices"></div></div>`);
    const ch=v.querySelector('.choices');let over=false;
    it.opts.forEach(o=>{const b=h(`<button class="card choice" aria-label="picture"><img src="${IMG[o.id]}" alt=""></button>`);
      b.onclick=()=>{if(over)return;if(o===it.t){over=true;b.classList.add('good');ding();later(()=>talk({img:o.id,...QA(o),mode:'ask'},()=>api.solve(b)),600);
          ch.querySelectorAll('.choice').forEach(c=>{if(c!==b)c.classList.add('bad')})}
        else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');buzz();ch.classList.add('wait');ch.querySelectorAll('.choice').forEach(c=>c.classList.add('wait'));later(()=>say(`No. Listen! ${ask}`),300);later(()=>{ch.classList.remove('wait');ch.querySelectorAll('.choice').forEach(c=>c.classList.remove('wait'))},2200)}};ch.append(b)});
    v.querySelector('.yb').onclick=()=>say(ask);
    api.play.append(v);later(()=>say(ask),350);
  });
}

/* ---------- 4 he or she sort ---------- */
function actSort(area,ctx){
  const play=h('<div class="play"></div>');area.append(play);
  const v=h(`<div class="sort"><div class="prompt">Who is she? Who is he? <span style="color:var(--muted);font-size:34px">Drag!</span></div><div class="pool"></div>
    <div class="bins"><div class="bin" data-g="she" style="border-color:var(--pink)"><h3 style="color:var(--pink)">She</h3><div class="got"></div></div>
    <div class="bin" data-g="he" style="border-color:var(--blue)"><h3 style="color:var(--blue)">He</h3><div class="got"></div></div></div></div>`);
  play.append(v);
  const pool=v.querySelector('.pool');const bins=[...v.querySelectorAll('.bin')];const items=SONE().length>=6?SONE():fillUp(SONE(),ONE,6);let sel=null,left=items.length,dragging=null;
  const scale=()=>$('#board').getBoundingClientRect().width/1600;
  function drop(el,x,bin){
    if(bin.dataset.g===x.g){el.remove();const c=h(`<div class="card"><img src="${IMG[x.id]}" alt="${x.w}"></div>`);bin.querySelector('.got').append(c);ding();left--;sel=null;const last=left===0;
      talk({img:x.id,...QA(x),mode:'ask'},()=>{addStar(1,c);if(last){ctx.done();later(()=>{play.innerHTML='';const b=h(`<div class="donebox"><div class="big">Well done!</div><div style="display:flex;gap:20px"><button class="bigbtn blueb">${ic('again')} Again</button><button class="bigbtn">Next game ${ic('right')}</button></div></div>`);play.append(b);b.querySelector('.blueb').onclick=()=>go(cur);b.querySelector('.bigbtn:not(.blueb)').onclick=ctx.next;say('Well done!')},800)}})}
    else{el.style.transform='';el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');buzz();say(`No. ${A(x)}`)}
  }
  function binAt(cx,cy){return bins.find(b=>{const r=b.getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom})}
  shuffle(items).forEach(x=>{const el=h(`<div class="card it" role="button" tabindex="0" aria-label="${x.w}"><img src="${IMG[x.id]}" alt="${x.w}"></div>`);pool.append(el);
    let sx,sy,moved=false,dn=false;
    el.addEventListener('pointerdown',e=>{if(dragging&&dragging!==el)return;dragging=el;dn=true;moved=false;sx=e.clientX;sy=e.clientY;try{el.setPointerCapture(e.pointerId)}catch(_){}});
    el.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<8)return;moved=true;el.classList.add('drag');const k=scale();el.style.transform=`translate(${dx/k}px,${dy/k}px)`;
      const b=binAt(e.clientX,e.clientY);bins.forEach(z=>z.classList.toggle('hover',z===b))});
    const up=e=>{if(!dn)return;dn=false;dragging=null;el.classList.remove('drag');bins.forEach(z=>z.classList.remove('hover'));
      if(moved){const b=binAt(e.clientX,e.clientY);if(b)drop(el,x,b);else el.style.transform=''}
      else{pool.querySelectorAll('.it').forEach(z=>z.classList.remove('sel'));if(sel&&sel.el===el){sel=null}else{sel={el,x};el.classList.add('sel');say(x.w)}}};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',()=>{dn=false;dragging=null;el.classList.remove('drag');el.style.transform=''});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pool.querySelectorAll('.it').forEach(z=>z.classList.remove('sel'));sel={el,x};el.classList.add('sel');say(x.w)}});
  });
  bins.forEach(b=>{b.tabIndex=0;b.setAttribute('role','button');const act=()=>{if(sel){sel.el.classList.remove('sel');drop(sel.el,sel.x,b)}else say(b.dataset.g==='she'?'She':'He')};b.addEventListener('click',e=>{if(e.target.closest('.it'))return;act()});b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}})});
  later(()=>say('Who is she? Who is he?'),350);
}

/* ---------- 5 listen & choose (no reading needed) ---------- */
function actFill(area,ctx){
  // each option: a big coloured speaker that SAYS "She is my aunt." — children choose by ear, not by reading
  const items=targets(SONE(),8).map(t=>({t,opts:shuffle([t,...pick(ONE.filter(o=>o.g===t.g&&o!==t),2)])}));
  const sc=[['var(--pink)','#D9467A'],['var(--blue)','#2A8FBD'],['var(--green)','#33A072']];
  rounds(area,ctx,items,(it,api)=>{
    const x=it.t,P=x.g==='she'?'She':'He',q=`Who is ${P.toLowerCase()}?`;
    const v=h(`<div class="fill"><div class="card pic"><img src="${IMG[x.id]}" alt="${x.w}"></div><div class="right" style="align-items:center;gap:18px">
      <button class="ask" aria-label="${q}"><span class="spk q">${ic('son')}</span><span>${q}</span></button>
      <div class="sbtns"></div><div class="ans" hidden></div></div></div>`);
    // step 1: listen to every speaker (each gets a tick); step 2: the choose buttons unlock
    const sb=v.querySelector('.sbtns');let over=false;const heard=new Set();const picks=[];
    it.opts.forEach((o,j)=>{const col=h(`<div class="scol"></div>`);
      const b=h(`<button class="sbtn" style="--c:${sc[j][0]};--s:${sc[j][1]}" aria-label="Listen ${j+1}">${ic('son')}<span class="tick">${ic('check')}</span></button>`);
      const pk=h(`<button class="pick" style="--c:${sc[j][0]};--s:${sc[j][1]}" aria-label="Choose ${j+1}" disabled>${ic('hand')}</button>`);
      b.onclick=()=>{sb.querySelectorAll('.sbtn').forEach(z=>z.classList.remove('playing'));b.classList.remove('playing');void b.offsetWidth;b.classList.add('playing');
        say(`${P} is my ${o.w}.`);later(()=>b.classList.remove('playing'),1700);
        if(!heard.has(j)){heard.add(j);b.classList.add('heard');
          if(heard.size===it.opts.length&&!over)later(()=>{picks.forEach(p=>p.disabled=false);sb.classList.add('ready');v.querySelector('.hint').textContent='Choose!';if(!over)say('Now choose!')},1800)}};
      pk.onclick=()=>{if(over||pk.disabled)return;
        if(o===x){over=true;pk.classList.add('good');b.classList.add('good');ding();
          sb.querySelectorAll('.scol').forEach(c=>{if(c!==col)c.classList.add('bad')});picks.forEach(p=>p.disabled=true);v.querySelector('.hint').hidden=true;
          const a=v.querySelector('.ans');a.hidden=false;a.innerHTML=`${q}<br>${P} is my <b style="color:${COLV[x.c]}">${x.w}</b>.`;later(()=>talk({img:x.id,a:A(x),mode:'repeat'},()=>api.solve(pk)),700)}
        else{pk.classList.remove('shake');void pk.offsetWidth;pk.classList.add('shake');buzz();later(()=>say('Listen again!'),300)}};
      picks.push(pk);col.append(b,pk);sb.append(col)});
    v.querySelector('.right').insertBefore(h(`<div class="hint">Listen to all!</div>`),v.querySelector('.ans'));
    v.querySelector('.ask').onclick=()=>say(over?sent(x):q);
    api.play.append(v);later(()=>say(`${q} Listen!`),350);
  });
}

/* ---------- flashlight ---------- */
function actFlash(area,ctx){
  const tg=targets(SEL(),8);
  rounds(area,ctx,tg,(x,api)=>{
    const ask=`Find the ${x.w}!`;
    const v=h(`<div class="flw"><div class="ftop"><button class="fcard" aria-label="${ask}"><svg class="torch" viewBox="0 0 24 24">${I.torch}</svg>${x.w}<span class="spk">${ic('son')}</span></button></div>
      <div class="fl"><div class="dark"></div><div class="ring"></div></div></div>`);
    api.play.append(v);
    const fl=v.querySelector('.fl'),ring=v.querySelector('.ring');
    // scene: target + 7 others, one per cell of a 4×2 grid with a little jitter
    const scene=shuffle([x,...pick(W.filter(o=>o!==x),7)]);
    const FW=1520,FH=fl.clientHeight||560,PW=190,PH=195,cw=FW/4,ch=FH/2;
    const pics=scene.map((o,i)=>{const c=i%4,r=Math.floor(i/4);
      const px=c*cw+(cw-PW)/2+(Math.random()-.5)*Math.max(0,cw-PW-40),py=r*ch+(ch-PH)/2+(Math.random()-.5)*Math.max(0,ch-PH-30);
      const el=h(`<div class="fp" style="left:${px}px;top:${py}px"><img src="${IMG[o.id]}" alt=""></div>`);fl.insertBefore(el,fl.querySelector('.dark'));
      return{o,el,cx:px+PW/2,cy:py+PH/2}});
    let lx=FW/2,ly=FH-90,over=false,waitT=0;
    // start the light on the darkest spot: the candidate point farthest from every picture
    {let best=-1;for(let gx=0;gx<=8;gx++)for(let gy=0;gy<=4;gy++){const X=60+gx*(FW-120)/8,Y=50+gy*(FH-100)/4;const d=Math.min(...pics.map(p=>Math.hypot(p.cx-X,p.cy-Y)));if(d>best){best=d;lx=X;ly=Y}}}
    const setL=(X,Y)=>{lx=Math.max(0,Math.min(FW,X));ly=Math.max(0,Math.min(FH,Y));fl.style.setProperty('--x',lx+'px');fl.style.setProperty('--y',ly+'px');ring.style.left=lx+'px';ring.style.top=ly+'px'};
    setL(lx,ly);
    const toLocal=e=>{const r=fl.getBoundingClientRect(),k=r.width/FW;return[(e.clientX-r.left)/k,(e.clientY-r.top)/k]};
    const litAt=(X,Y)=>pics.find(p=>Math.abs(p.cx-X)<PW/2&&Math.abs(p.cy-Y)<PH/2&&Math.hypot(p.cx-lx,p.cy-ly)<150);
    let down=null;
    fl.addEventListener('pointerdown',e=>{if(over||Date.now()<waitT)return;const[X,Y]=toLocal(e);down={X,Y,hit:litAt(X,Y),moved:false};try{fl.setPointerCapture(e.pointerId)}catch(_){}
      if(!down.hit)setL(X,Y)});
    fl.addEventListener('pointermove',e=>{if(over||!down)return;const[X,Y]=toLocal(e);if(Math.hypot(X-down.X,Y-down.Y)>12)down.moved=true;if(down.moved||!down.hit)setL(X,Y)});
    const up=()=>{if(!down)return;const d=down;down=null;if(over||d.moved||!d.hit)return;
      const p=d.hit;
      if(p.o===x){over=true;fl.classList.add('found');p.el.classList.add('good');ding();later(()=>talk({img:x.id,...QA(x),mode:'ask'},()=>api.solve(p.el)),900)}
      else{p.el.classList.remove('shake');void p.el.offsetWidth;p.el.classList.add('shake');buzz();waitT=Date.now()+2000;later(()=>say(p.o.g==='both'?`That's my cousin! ${ask}`:`That's my ${p.o.w}! ${ask}`),300)}};
    fl.addEventListener('pointerup',up);fl.addEventListener('pointercancel',()=>{down=null});
    v.querySelector('.fcard').onclick=()=>say(ask);
    later(()=>say(ask),350);
  });
}
const A=x=>`${x.g==='she'?'She':'He'} is my ${x.w}.`;

function actPeek(area,ctx){
  const items=targets(SEL(),6);const tc=['var(--pink)','var(--blue)','var(--purple)','var(--green)','var(--orange)','var(--pink)','var(--blue)','var(--purple)','var(--green)'];
  rounds(area,ctx,items,(x,api)=>{
    const q=QA(x).q;
    const v=h(`<div class="peek"><div class="pbox"><img src="${IMG[x.id]}" alt=""><div class="tiles"></div></div>
      <div class="pside"><div class="prompt" style="text-align:left">${q}</div><div class="tr" style="color:var(--muted)">Open a tile and guess!</div>
      <button class="bigbtn purpleb">${ic('eye')} Show me!</button><div class="ans" hidden></div></div></div>`);

}

/* ---------- 7 what's missing ---------- */
function actMissing(area,ctx){
  const tg=targets(SEL(),6);const items=tg.map(x=>{const set=shuffle([x,...pick(W.filter(o=>o!==x),4)]);return{set,gone:set.indexOf(x)}});
  rounds(area,ctx,items,(it,api)=>{
    const v=h(`<div class="miss"><div class="prompt">Look and remember!</div><div class="mrow"></div><button class="bigbtn purpleb">Close your eyes!</button></div>`);
    const row=v.querySelector('.mrow');
    it.set.forEach(x=>{const c=h(`<button class="card" aria-label="${x.w}"><img src="${IMG[x.id]}" alt="${x.w}"></button>`);c.onclick=()=>say(x.w);row.append(c)});
    const btn=v.querySelector('.purpleb');
    btn.onclick=()=>{btn.hidden=true;say('Close your eyes!');const cu=h(`<div id="curtain"><div>Close your eyes!</div><div style="font-size:120px">3</div></div>`);$('#area').append(cu);
      let n=3;const tick=()=>{n--;if(n>0){cu.lastChild.textContent=n;later(tick,900)}else{
        const x=it.set[it.gone];const old=row.children[it.gone];const q=h(`<button class="card qcard" aria-label="What's missing?">?</button>`);row.replaceChild(q,old);
        cu.remove();v.querySelector('.prompt').textContent="Open your eyes! What's missing?";say("Open your eyes! What's missing?");
        q.onclick=()=>{const r=h(`<div class="card good"><img src="${IMG[x.id]}" alt="${x.w}"></div>`);row.replaceChild(r,q);v.querySelector('.prompt').innerHTML=`It's <span style="color:${COLV[x.c]}">${'my '+x.w}</span>!`;ding();later(()=>talk({img:x.id,...QA(x),mode:'ask'},()=>api.solve(r)),700)}}};
      later(tick,900)};
    api.play.append(v);later(()=>say('Look and remember!'),350);
  });
}

/* ---------- 8 memory ---------- */
function actMemory(area,ctx){
  const items=[fillUp(SEL(),W,6),fillUp(SEL(),W,6)];const bc=['var(--pink)','var(--blue)','var(--purple)','var(--green)'];
  rounds(area,ctx,items,(set,api)=>{
    const g=h('<div class="mem"></div>');let open=[],lock=false,pairs=0;
    shuffle([...set,...set]).forEach((x,j)=>{const c=h(`<button class="mc" aria-label="Card ${j+1}"><div class="in"><div class="b" style="background:${bc[j%4]}">?</div><div class="f"><img src="${IMG[x.id]}" alt="${x.w}"></div></div></button>`);
      c.onclick=()=>{if(lock||c.classList.contains('up'))return;c.classList.add('up');say(x.w);open.push({c,x});
        if(open.length===2){const[a,b]=open;open=[];if(a.x===b.x){a.c.classList.add('ok');b.c.classList.add('ok');later(()=>{ding();pairs++;if(pairs===set.length){talk({img:a.x.id,...QA(a.x),mode:'ask'},()=>{api.solve(b.c,2);later(()=>say('Well done!'),500)})}else{burst(b.c);later(()=>say(sent(a.x)),300)}},450)}
          else{lock=true;later(()=>{a.c.classList.remove('up');b.c.classList.remove('up');lock=false},1300)}}};g.append(c)});
    api.play.append(g);
  });
}

/* ---------- 9 wheel ---------- */
function actWheel(area,ctx){
  const play=h('<div class="play"></div>');area.append(play);
  let WH=SEL();while(WH.length<6)WH=WH.concat(SEL()); /* few chosen words -> each appears more than once */const N=WH.length,seg=360/N,R=320,cols=['#FF9AB8','#8ED3F2','#BBA2EC','#8EDDB9','#FFE07A'];
  let svg=`<svg id="wheel" viewBox="-320 -320 640 640"><defs>`;
  WH.forEach((x,i)=>{svg+=`<clipPath id="cp${i}"><circle r="58"/></clipPath>`});svg+='</defs>';
  const P=(a,r)=>[r*Math.sin(a*Math.PI/180),-r*Math.cos(a*Math.PI/180)];
  WH.forEach((x,i)=>{const a0=i*seg,a1=(i+1)*seg,[x0,y0]=P(a0,R-6),[x1,y1]=P(a1,R-6),[cx,cy]=P(a0+seg/2,R-110);
    svg+=`<path d="M0 0 L${x0} ${y0} A${R-6} ${R-6} 0 0 1 ${x1} ${y1}Z" fill="${cols[i%5]}" stroke="#fff" stroke-width="6"/>`;
    svg+=`<g transform="translate(${cx} ${cy}) rotate(${a0+seg/2})"><circle r="62" fill="#fff"/><image href="${IMG[x.id]}" x="-58" y="-58" width="116" height="116" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${i})"/></g>`});
  svg+=`<circle r="${R-4}" fill="none" stroke="#fff" stroke-width="8"/></svg>`;
  const v=h(`<div class="wh"><div class="wheelbox"><div class="pointer"></div>${svg}<button class="hub">SPIN</button></div><div class="wres"><div class="prompt" style="text-align:left">Spin the wheel!</div></div></div>`);
  play.append(v);
  const wheel=v.querySelector('#wheel'),hub=v.querySelector('.hub'),res=v.querySelector('.wres');let rot=0,busy=false,spins=0,last=-1;
  hub.onclick=()=>{if(busy)return;busy=true;let t;do{t=Math.floor(Math.random()*N)}while(t===last);last=t;
    const jitter=(Math.random()-.5)*seg*.6;const want=((360-(t*seg+seg/2+jitter))%360+360)%360;
    let nr=rot-((rot%360)+360)%360+360*6+want;if(nr-rot<360*5)nr+=360;rot=nr;wheel.style.transform=`rotate(${rot}deg)`;wheel.dataset.target=t;
    res.innerHTML='<div class="prompt" style="text-align:left">...</div>';tone([[400,.08,0],[450,.08,.2],[500,.08,.4],[550,.08,.6]]);
    later(()=>{busy=false;const x=WH[t];spins++;
      res.innerHTML=`<div class="card"><img src="${IMG[x.id]}" alt="${x.w}"></div><button class="yb" style="border-radius:0;text-align:left">${sent(x).replace('. Who','.<br>Who')}</button><div class="prompt" style="text-align:left;color:${COLV[x.c]}">${x.act}</div>`;
      res.querySelector('.yb').onclick=()=>say(sent(x));ding();talk({img:x.id,...QA(x),mode:'ask'},()=>{addStar(1,res.querySelector('.card'));later(()=>say(x.act),300)});if(spins>=3)ctx.done()},4300)};
  later(()=>say('Spin the wheel!'),350);
}

/* ---------- 10 review ---------- */
function actReview(area,ctx){
  const play=h('<div class="play" style="flex-direction:column;gap:22px"></div>');area.append(play);
  play.append(h(`<div class="prompt" style="color:var(--pink);font-size:60px">Family Review</div>`));
  const g=h('<div class="rev"></div>');let heard=new Set();
  W.forEach(x=>{const b=h(`<button class="rv"><img src="${IMG[x.id]}" alt=""><b style="color:${COLV[x.c]}">${cap(x.w)}</b></button>`);
    b.onclick=()=>{say(x.w);b.classList.remove('wiggle');void b.offsetWidth;b.classList.add('wiggle');heard.add(x.id);if(heard.size===W.length)ctx.done()};g.append(b)});
  const bye=h(`<button class="bigbtn pinkb" style="grid-column:span 1;justify-content:center">Goodbye!</button>`);bye.onclick=()=>{ctx.done();say('Goodbye, family! See you!');burst(bye)};g.append(bye);
  play.append(g);
}

/* full screen: standard API, then the Safari/iPad (webkit) one; if the browser or the page frame refuses, say how to do it by hand */
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function fullHelp(){const mac=/Mac|iPad|iPhone/.test(navigator.platform+navigator.userAgent);
  modal(`<h2>Full screen</h2><p>This browser did not allow full screen from the button.</p><ul><li>${mac?'Mac: press <b>Ctrl + Cmd + F</b> (or View → Enter Full Screen).':'Windows / smart board: press <b>F11</b>.'}</li><li>If the page is open inside another app (for example a chat app), open the file directly in Chrome or Edge, then press the button again.</li><li>iPhone does not support full screen for web pages; turn the phone sideways instead.</li></ul><div class="row"><button class="bigbtn" data-x>OK</button></div>`)}
function toggleFull(){const d=document,el=d.documentElement;
  try{if(fsEl()){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
    const req=el.requestFullscreen||el.webkitRequestFullscreen;if(!req){fullHelp();return}
    const r=req.call(el);if(r&&r.catch)r.catch(()=>fullHelp());
    setTimeout(()=>{if(!fsEl())fullHelp()},700)}catch(e){fullHelp()}}
/* ---------- chrome ---------- */
function fit(){const st=$('#stage'),b=$('#board');const k=Math.min(st.clientWidth/1600,st.clientHeight/900);b.style.transformOrigin='center center';b.style.transform=`translate(-50%,-50%) scale(${k})`}
window.addEventListener('resize',fit);
function soundIcon(){$('#bSound').innerHTML=ic(S.sound?'son':'soff')}
function boot(){load();pickVoice();
  $('#bHome').innerHTML=ic('home');$('#bPrev').innerHTML=ic('left');$('#bNext').innerHTML=ic('right');$('#bAgain').innerHTML=ic('again');$('#bTip').innerHTML=ic('tip');$('#bFull').innerHTML=ic('full');soundIcon();paintStars();$('#bPick').innerHTML=ic('pick');$('#bPick').onclick=picker;$('#bCls').onclick=classScreen;
  $('#bHome').onclick=()=>{if(cur>=0)go(-1);else if(cur===-1)topicScreen();else if(cur!==-4)unitScreen()};$('#bPrev').onclick=()=>{if(cur>0)go(cur-1)};$('#bNext').onclick=()=>{if(cur>=0&&cur<ACTS.length-1)go(cur+1)};
  $('#bAgain').onclick=()=>{if(cur>=0)go(cur)};
  $('#bSound').onclick=()=>{S.sound=!S.sound;store();soundIcon();if(!S.sound)hush();if(cur===-1)go(-1)};
  $('#bTip').onclick=()=>{if(cur<0){if(cur<=-3)return;modal(`<h2>How to use</h2><ul><li>Choose a unit first (Unit 2 is ready), then a topic: <b>Family members</b> or <b>Body parts</b>. "◀ Topics" and "◀ Units" go back; the home button goes up one level.</li><li>Tap a game, or press "Start" to open the first unfinished game.</li><li>Top bar: menu, previous/next game, ${ONE_CLASS?'':'class, '}name picker, stars, play again, sound, tips, full screen.</li><li>The orange "Next" button moves to the next round; the dots jump to any round.</li><li><b>Speaking step:</b> after a correct answer the "Your turn!" screen opens. The question is spoken, the class answers out loud ("Help" says the answer). The star comes when you press "We said it!".</li>${ONE_CLASS?'':'<li><b>Class:</b> the purple label (e.g. J6A) changes the class. Each class keeps its own stars.</li>'}<li><b>Star reward:</b> in the name picker, press "Star reward", tap the children who are behaving well, then "Star draw!". Each child's stars are counted on their bubble; New round clears them. After a normal pick, "Give a star" rewards that child directly.</li><li><b>Name picker:</b> the person icon picks a name and says it; everyone gets one turn per round. The "Name" button on the "Your turn!" screen also picks a name.</li><li><b>Settings</b> (last tile): classroom/home, speaking step, teams, classes, names and words to practise.</li><li>If the device has no English voice, sentences appear on screen for an adult to read aloud.</li><li>Stars and settings are saved on this device.</li></ul><div class="row"><button class="bigbtn" data-x>OK</button></div>`);return}
    const A=ACTS[cur];modal(`<h2>${A.name}</h2>${S.mode==='home'?'<p><b>At home:</b> these tips are written for the classroom; play them with your child. On the "Your turn!" screen, press "I said it!" when your child says the sentence.</p>':''}<ul>${A.tip.map(t=>`<li>${t}</li>`).join('')}</ul><div class="row"><button class="bigbtn" data-x>OK</button></div>`)};
  $('#bFull').onclick=toggleFull;
  document.addEventListener('fullscreenchange',fit);document.addEventListener('webkitfullscreenchange',fit);
  setTopic(S.topic);fit();if(!ONE_CLASS&&S.mode==='class'&&(!S.cls||!clsChosen()))classScreen();else unitScreen()}
boot();
</script>
